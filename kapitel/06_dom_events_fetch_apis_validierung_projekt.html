<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="die-dom-baumstruktur--selektion">Die DOM-Baumstruktur &amp; Selektion</h3>
<p>Das Document Object Model: Dokument-, Element- und Textknoten<br />
Gezieltes Selektieren: querySelector() und querySelectorAll()<br />
Traversierung im Baum: parentElement, children, closest()<br />
Entfall: Keine Vorgehensweisen mit document.write() oder alten getElementsByName-Tricks.</p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="61">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="das-document-object-model-dom--knotenarten">Das Document Object Model (DOM) &amp; Knotenarten</h3>
<ul>
<li><strong>Was ist das DOM?</strong>
<ul>
<li>Die objektorientierte Repräsentation des HTML-Dokuments als <strong>Baumstruktur</strong> im Arbeitsspeicher des Browsers.</li>
<li>Ermöglicht JavaScript den dynamischen Lese- und Schreibzugriff auf Inhalt, Struktur und CSS-Styles.</li>
</ul>
</li>
<li><strong>Die 3 wichtigsten Knotenarten (<em>Node Types</em>):</strong>
<ol>
<li><strong>Dokument-Knoten (<code>document</code>):</strong> Die Wurzel des gesamten Baums.</li>
<li><strong>Element-Knoten (<code>Element</code>):</strong> HTML-Tags (z. B. <code>&lt;h1&gt;</code>, <code>&lt;div&gt;</code>, <code>&lt;button&gt;</code>).</li>
<li><strong>Text-Knoten (<code>Text</code>):</strong> Der tatsächliche Textinhalt innerhalb von Elementen.</li>
</ol>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="61">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<blockquote>
<p><strong>Analogie:</strong><br />
HTML ist der statische Bauplan;<br />
das DOM ist das lebendige Bauwerk im Arbeitsspeicher!</p>
</blockquote>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="61">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="gezieltes-selektieren-queryselector--queryselectorall">Gezieltes Selektieren: <code>querySelector</code> &amp; <code>querySelectorAll</code></h3>
<p>Der moderne Standard zur Elementauswahl mittels flexibler <strong>CSS-Selektoren</strong>:</p>
<ul>
<li><strong><code>document.querySelector(selector)</code>:</strong>
<ul>
<li>Liefert das <strong>erste passende Element</strong> zurück (oder <code>null</code>).</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript">  <span class="hljs-keyword">const</span> titel = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;h1&quot;</span>);         <span class="hljs-comment">// Per Tag-Name</span>
  <span class="hljs-keyword">const</span> mainBtn = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;#submitBtn&quot;</span>); <span class="hljs-comment">// Per ID (#)</span>
  <span class="hljs-keyword">const</span> activeCard = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;.card.active&quot;</span>); <span class="hljs-comment">// Per Klasse (.)</span>
</code></pre>
<ul>
<li><strong><code>document.querySelectorAll(selector)</code>:</strong>
<ul>
<li>Liefert eine <strong>NodeList</strong> (Sammlung) <strong>aller passenden Elemente</strong> zurück.</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript">  <span class="hljs-keyword">const</span> alleButtons = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelectorAll</span>(<span class="hljs-string">&quot;button.btn&quot;</span>);
  alleButtons.<span class="hljs-title function_">forEach</span>(<span class="hljs-function"><span class="hljs-params">btn</span> =&gt;</span> btn.<span class="hljs-property">disabled</span> = <span class="hljs-literal">true</span>);
</code></pre>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="61">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="traversierung-im-dom-baum-navigieren">Traversierung im DOM-Baum (Navigieren)</h3>
<p>Gezieltes Wandern zwischen Eltern-, Geschwister- und Kind-Elementen:</p>
<ul>
<li><strong><code>parentElement</code>:</strong> Springt zum übergeordneten Vater-Element.</li>
<li><strong><code>children</code>:</strong> Liefert alle direkten Kind-Elemente als Sammlung.</li>
<li><strong><code>closest(selector)</code>:</strong> Wandert nach <strong>oben</strong> und sucht das nächste passende Eltern-Element<br />
(ideal für Event-Handling!).</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> item = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;.list-item&quot;</span>);

<span class="hljs-keyword">const</span> elternNode = item.<span class="hljs-property">parentElement</span>; <span class="hljs-comment">// Vater-Element</span>
<span class="hljs-keyword">const</span> form = item.<span class="hljs-title function_">closest</span>(<span class="hljs-string">&quot;form&quot;</span>);     <span class="hljs-comment">// Nächstes &lt;form&gt; nach oben</span>
<span class="hljs-keyword">const</span> kinder = form.<span class="hljs-property">children</span>;          <span class="hljs-comment">// Direkte Kinder von form</span>
</code></pre>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="61">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="%C3%BCbersicht-dom-selektion--traversierung">Übersicht: DOM-Selektion &amp; Traversierung</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Methode / Eigenschaft</th>
<th style="text-align:left">Funktion</th>
<th style="text-align:left">Rückgabewert</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong><code>querySelector('sel')</code></strong></td>
<td style="text-align:left">Erstes Treffer-Element</td>
<td style="text-align:left"><code>Element</code> oder <code>null</code></td>
</tr>
<tr>
<td style="text-align:left"><strong><code>querySelectorAll('sel')</code></strong></td>
<td style="text-align:left">Alle Treffer-Elemente</td>
<td style="text-align:left"><code>NodeList</code></td>
</tr>
<tr>
<td style="text-align:left"><strong><code>parentElement</code></strong></td>
<td style="text-align:left">Übergeordnetes Vater-Element</td>
<td style="text-align:left"><code>Element</code></td>
</tr>
<tr>
<td style="text-align:left"><strong><code>children</code></strong></td>
<td style="text-align:left">Direkte Kind-Elemente</td>
<td style="text-align:left"><code>HTMLCollection</code></td>
</tr>
<tr>
<td style="text-align:left"><strong><code>closest('sel')</code></strong></td>
<td style="text-align:left">Nächstes Eltern-Element nach oben</td>
<td style="text-align:left"><code>Element</code> oder <code>null</code></td>
</tr>
</tbody>
</table>
<p><strong>Best Practice:</strong></p>
<ul>
<li>Nutze ausschließlich <code>querySelector</code> / <code>querySelectorAll</code> mit CSS-Selektoren.</li>
<li>Veraltete Methoden wie <code>document.write()</code> entfallen komplett.</li>
</ul>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="61">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="praxis-check-dom-selektion--traversierung-im-einsatz">Praxis-Check: DOM-Selektion &amp; Traversierung im Einsatz</h3>
<ul>
<li><strong>Ausführbare Demodatei:</strong> <code>Samples/JS/dom-selection-demo.html</code></li>
<li><strong>Gezeigte Kernkonzepte im Code:</strong>
<ol>
<li><strong><code>querySelector()</code>:</strong> Greift gezielt das erste Element per ID (<code>#mainContainer</code>) oder CSS-Klasse (<code>.card-item.active</code>).</li>
<li><strong><code>querySelectorAll()</code>:</strong> Selektiert alle Treffer als <code>NodeList</code> und durchläuft diese per <code>.forEach()</code>.</li>
<li><strong><code>parentElement</code> &amp; <code>children</code>:</strong> Navigiert eine Ebene nach oben zum Vaterknoten bzw. liest direkte Kindknoten aus.</li>
<li><strong><code>closest(selector)</code>:</strong> Wandert im Baum nach oben, um das nächstgelegene passende Eltern-Element zu finden.</li>
</ol>
</li>
</ul>
<p><strong>Ausprobieren:</strong><br />
Öffne <code>Samples/JS/dom-selection-demo.html</code> im Browser und teste die interaktiven Buttons!</p>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="61">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="dynamische-dom-manipulation">Dynamische DOM-Manipulation</h3>
<p>(<code>createElement</code> &amp; <code>append</code>)</p>
<p><strong>Knoten im Speicher erzeugen (<code>document.createElement</code>):</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript">   <span class="hljs-keyword">const</span> newCard = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">createElement</span>(<span class="hljs-string">&quot;div&quot;</span>);
   newCard.<span class="hljs-property">textContent</span> = <span class="hljs-string">&quot;Neue Karte&quot;</span>;
</code></pre>
<p><strong>In den DOM-Baum einfügen (<code>append</code> vs. <code>prepend</code>):</strong></p>
<ul>
<li><strong><code>parent.append(child)</code></strong>: Fügt das Element am <strong>Ende</strong> der Kinder ein.</li>
<li><strong><code>parent.prepend(child)</code></strong>: Fügt das Element am <strong>Anfang</strong> der Kinder ein.</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="61">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>HTML-Strings direkt einfügen (<code>insertAdjacentHTML</code>):</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript">   <span class="hljs-keyword">const</span> list = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;#kundenListe&quot;</span>);
   <span class="hljs-comment">// Positionen: &#x27;beforebegin&#x27;, &#x27;afterbegin&#x27;, &#x27;beforeend&#x27;, &#x27;afterend&#x27;</span>
   list.<span class="hljs-title function_">insertAdjacentHTML</span>(<span class="hljs-string">&quot;beforeend&quot;</span>, <span class="hljs-string">`&lt;li class=&quot;item&quot;&gt;Neuer Kunde&lt;/li&gt;`</span>);
</code></pre>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="61">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="klassen--stile-dynamisch-steuern-classlist">Klassen &amp; Stile dynamisch steuern (<code>classList</code>)</h3>
<p>Verwende <strong><code>classList</code></strong> zur sauberen Steuerung von CSS-Klassen (Trennung von JS &amp; Styling!):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> btn = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;.action-btn&quot;</span>);

btn.<span class="hljs-property">classList</span>.<span class="hljs-title function_">add</span>(<span class="hljs-string">&quot;active&quot;</span>);       <span class="hljs-comment">// Klasse hinzufügen</span>
btn.<span class="hljs-property">classList</span>.<span class="hljs-title function_">remove</span>(<span class="hljs-string">&quot;disabled&quot;</span>);  <span class="hljs-comment">// Klasse entfernen</span>
btn.<span class="hljs-property">classList</span>.<span class="hljs-title function_">toggle</span>(<span class="hljs-string">&quot;highlight&quot;</span>); <span class="hljs-comment">// Umschalten (an/aus)</span>

<span class="hljs-keyword">if</span> (btn.<span class="hljs-property">classList</span>.<span class="hljs-title function_">contains</span>(<span class="hljs-string">&quot;active&quot;</span>)) {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Button ist aktiv!&quot;</span>);
}
</code></pre>
<ul>
<li><strong>Direkte Inline-Styles (nur bei dynamischen Werten):</strong></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript">element.<span class="hljs-property">style</span>.<span class="hljs-property">backgroundColor</span> = <span class="hljs-string">&quot;#005a9c&quot;</span>; <span class="hljs-comment">// CamelCase-Schreibweise!</span>
</code></pre>

<h3 id="data-attribute-nutzen-data---dataset">Data-Attribute nutzen (<code>data-*</code> &amp; <code>dataset</code>)</h3>
<p>Koppelung von HTML-Struktur und JavaScript-Daten über benutzerdefinierte Attribute:</p>
<ul>
<li><strong>HTML-Quellcode:</strong></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;user-btn&quot;</span> <span class="hljs-attr">data-user-id</span>=<span class="hljs-string">&quot;42&quot;</span> <span class="hljs-attr">data-role</span>=<span class="hljs-string">&quot;admin&quot;</span>&gt;</span>Profil<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
</code></pre>
<ul>
<li><strong>JavaScript-Zugriff über <code>element.dataset</code>:</strong></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> btn = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;.user-btn&quot;</span>);

<span class="hljs-comment">// Auslesen (data-user-id wird automatisch zu CamelCase userId):</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(btn.<span class="hljs-property">dataset</span>.<span class="hljs-property">userId</span>); <span class="hljs-comment">// &quot;42&quot; (immer vom Typ String!)</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(btn.<span class="hljs-property">dataset</span>.<span class="hljs-property">role</span>);   <span class="hljs-comment">// &quot;admin&quot;</span>

<span class="hljs-comment">// Schreiben / Ändern:</span>
btn.<span class="hljs-property">dataset</span>.<span class="hljs-property">role</span> = <span class="hljs-string">&quot;superadmin&quot;</span>;
</code></pre>

<h2 id="modernes-event-handling">Modernes Event Handling</h2>
<h3 id="interaktivit%C3%A4t--event-listener">Interaktivität &amp; Event-Listener</h3>
<p><strong>Übersicht:</strong></p>
<ul>
<li><strong>Paradigmenwechsel:</strong> Saubere Trennung von HTML (Struktur) und JS (Verhalten)</li>
<li><strong><code>addEventListener()</code>:</strong> Events wie Klicks oder Eingaben sauber abfangen</li>
<li><strong>Das Event-Objekt (<code>event</code>):</strong> <code>event.target</code> und <code>event.preventDefault()</code></li>
<li><strong>Praxis:</strong> Interaktive Steuerung von Webseiten-Elementen</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="61">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="entfall-keine-inline-eventhandler-onclick-im-html">Entfall: Keine Inline-Eventhandler (<code>onclick=&quot;&quot;</code> im HTML)</h3>
<p><strong>Veralteter Ansatz (Anti-Pattern):</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-comment">&lt;!-- NICHT VERWENDEN: Vermischt Struktur mit Logik --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">onclick</span>=<span class="hljs-string">&quot;speichernData()&quot;</span>&gt;</span>Speichern<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
</code></pre>
<p><strong>Warum Inline-Handler problematisch sind:</strong></p>
<ul>
<li><strong>Verletzung der Trennung von Belangen (Separation of Concerns):</strong> HTML steuert Struktur/Inhalt, JS das Verhalten.</li>
<li><strong>Verschmutzung des globalen Scope:</strong> Funktionen müssen global deklariert sein.</li>
<li><strong>Wartbarkeit &amp; Flexibilität:</strong> Schwer zu debuggen und nur ein Handler pro Element möglich.</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="61">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Modernes Verfahren:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;saveBtn&quot;</span>&gt;</span>Speichern<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> saveBtn = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&#x27;#saveBtn&#x27;</span>);

<span class="hljs-comment">// Saubere Registrierung des Event-Listeners in JavaScript:</span>
saveBtn.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&#x27;click&#x27;</span>, speichernData);
</code></pre>
<ul>
<li>Trennt HTML-Markup und JavaScript-Logik vollständig.</li>
<li>Erlaubt beliebig viele Listener auf demselben Element.</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="61">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="event-listener-in-der-praxis-addeventlistener">Event-Listener in der Praxis (<code>addEventListener</code>)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> btn = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&#x27;.action-btn&#x27;</span>);

<span class="hljs-comment">// Variante 1: Direkt mit anonymer Pfeilfunktion (Arrow Function)</span>
btn.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&#x27;click&#x27;</span>, <span class="hljs-function">(<span class="hljs-params">event</span>) =&gt;</span> {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;Button wurde geklickt!&#x27;</span>);
});

<span class="hljs-comment">// Variante 2: Mit benannter Funktion (erhöht Lesbarkeit &amp; Wiederverwendbarkeit)</span>
<span class="hljs-keyword">function</span> <span class="hljs-title function_">handleAction</span>(<span class="hljs-params">event</span>) {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;Aktion ausgeführt!&#x27;</span>);
}
btn.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&#x27;click&#x27;</span>, handleAction);
</code></pre>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="61">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="das-event-objekt-event">Das Event-Objekt (<code>event</code>)</h3>
<p>Beim Auslösen eines Events übergibt der Browser automatisch ein <strong>Event-Objekt</strong> mit nützlichen Metadaten:</p>
<ul>
<li><strong><code>event.target</code></strong>: Das konkrete HTML-Element, das das Ereignis ausgelöst hat.</li>
<li><strong><code>event.preventDefault()</code></strong>: Unterdrückt das standardmäßige Verhalten des Browsers (z. B. Seiten-Reload beim Formular-Absenden oder Springen bei Links).</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> link = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&#x27;#specialLink&#x27;</span>);

link.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&#x27;click&#x27;</span>, <span class="hljs-function">(<span class="hljs-params">event</span>) =&gt;</span> {
    event.<span class="hljs-title function_">preventDefault</span>(); <span class="hljs-comment">// Verhindert das Standard-Springen der Seite</span>
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;Geklicktes Element:&#x27;</span>, event.<span class="hljs-property">target</span>);
});
</code></pre>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="61">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="%C3%BCbersicht-modernes-event-handling">Übersicht: Modernes Event Handling</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Konzept</th>
<th style="text-align:left">Syntax / Methode</th>
<th style="text-align:left">Zweck / Praxis-Nutzen</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Listener registrieren</strong></td>
<td style="text-align:left"><code>el.addEventListener('click', fn)</code></td>
<td style="text-align:left">Reagiert auf Benutzerinteraktionen ohne Inline-HTML</td>
</tr>
<tr>
<td style="text-align:left"><strong>Standardverhalten stoppen</strong></td>
<td style="text-align:left"><code>event.preventDefault()</code></td>
<td style="text-align:left">Verhindert ungewolltes Neuladen bei Formularen &amp; Links</td>
</tr>
<tr>
<td style="text-align:left"><strong>Auslöser ermitteln</strong></td>
<td style="text-align:left"><code>event.target</code></td>
<td style="text-align:left">Referenz auf das konkret angeklickte Element</td>
</tr>
</tbody>
</table>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="61">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-class="structural" data-theme="thws-sts" lang="en-US" class="structural" data-marpit-pagination="25" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--class:structural;--theme:thws-sts;" data-marpit-pagination-total="61">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<h2 id="asynchrone-programmierung--fetch-api">Asynchrone Programmierung &amp; Fetch API</h2>
<h3 id="geodaten--externe-apis-in-javascript-laden">Geodaten &amp; externe APIs in JavaScript laden</h3>
<p><strong>Übersicht:</strong></p>
<ul>
<li><strong>Synchron vs. Asynchron:</strong> Warum Webseiten beim Datenladen nicht einfrieren dürfen</li>
<li><strong>Daten abrufen mit <code>fetch()</code>:</strong> Der moderne Browser-Standard für externe Ressourcen</li>
<li><strong>Elegante Steuerung mit <code>async / await</code>:</strong> Asynchroner Code, so einfach lesbar wie synchroner Code</li>
<li><strong>Geodaten-Praxis:</strong> GeoJSON-Dateien laden, parsen &amp; im DOM verarbeiten</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="61">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="warum-asynchronit%C3%A4t">Warum Asynchronität?</h3>
<ul>
<li><strong>Synchroner Ablauf (Problem):</strong>
<ul>
<li>Befehle werden streng nacheinander ausgeführt.</li>
<li>Beim Laden großer Dateien (z. B. 5 MB GeoJSON) <strong>blockiert</strong> der gesamte Browser: Die Webseite friert ein, Buttons reagieren nicht mehr!</li>
</ul>
</li>
<li><strong>Asynchroner Ablauf (Lösung):</strong>
<ul>
<li>Der Browser fordert die Datei im Hintergrund an.</li>
<li>Die Webseite bleibt sofort bedienbar und flüssig.</li>
<li>Sobald die Daten eingetroffen sind, verarbeitet eine Funktion das Ergebnis.</li>
</ul>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="61">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<blockquote>
<p>Externe Geodaten, Karten-Tiles oder APIs werden in JavaScript <strong>immer asynchron</strong> geladen!</p>
</blockquote>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="61">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="daten-abrufen-mit-der-fetch-api">Daten abrufen mit der <code>fetch()</code>-API</h3>
<p>Die <strong><code>fetch()</code>-API</strong> ist die moderne Schnittstelle zur Kommunikation mit Webservern:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// Sendet eine HTTP-Anfrage an den Server</span>
<span class="hljs-title function_">fetch</span>(<span class="hljs-string">&#x27;orte.geojson&#x27;</span>);
</code></pre>
<ul>
<li><strong>Entfall veralteter Methoden:</strong>
<ul>
<li>Kein <code>XMLHttpRequest</code> (XHR) und kein <code>jQuery.ajax()</code> mehr!</li>
</ul>
</li>
<li><strong>Das Grundprinzip in 2 Schritten:</strong>
<ol>
<li><strong>Anfrage senden:</strong> Server gibt ein Antwort-Objekt (<em>Response</em>) zurück.</li>
<li><strong>JSON parsen:</strong> <code>response.json()</code> konvertiert den Text-String in echte JS-Objekte.</li>
</ol>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="61">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="lesbarer-code-durch-async--await">Lesbarer Code durch <code>async</code> / <code>await</code></h3>
<p>Das Schlüsselwort-Paar <strong><code>async / await</code></strong> macht asynchronen Code extrem übersichtlich:</p>
<ul>
<li><strong><code>async</code></strong>: Kennzeichnet eine Funktion als asynchron (<code>async function ...</code>).</li>
<li><strong><code>await</code></strong>: Pausiert die Ausführung <em>innerhalb</em> der Funktion, bis die Antwort vorliegt.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// Asynchrone Funktion zum Laden von Geodaten</span>
<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">ladeGeodaten</span>(<span class="hljs-params"></span>) {
    <span class="hljs-comment">// 1. Auf Antwort des Servers warten:</span>
    <span class="hljs-keyword">const</span> response = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(<span class="hljs-string">&#x27;orte.geojson&#x27;</span>);
    <span class="hljs-comment">// 2. Auf das Konvertieren der GeoJSON-Daten warten:</span>
    <span class="hljs-keyword">const</span> geodaten = <span class="hljs-keyword">await</span> response.<span class="hljs-title function_">json</span>();
    
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;Geladene Orte:&#x27;</span>, geodaten);
}
<span class="hljs-title function_">ladeGeodaten</span>();
</code></pre>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="61">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="fehlerbehandlung-mit-try--catch">Fehlerbehandlung mit <code>try ... catch</code></h3>
<p>Was passiert, wenn die GeoJSON-Datei nicht existiert (404) oder das Netzwerk ausfällt?</p>
<p>Verwende <strong><code>try ... catch</code></strong>, um Fehler abzufangen, ohne dass die Webanwendung abstürzt:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">ladeGeodatenSicher</span>(<span class="hljs-params">url</span>) {
    <span class="hljs-keyword">try</span> {
        <span class="hljs-keyword">const</span> response = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(url);
        
        <span class="hljs-comment">// Prüfen, ob der HTTP-Status erfolgreich war (z. B. Code 200)</span>
        <span class="hljs-keyword">if</span> (!response.<span class="hljs-property">ok</span>) {
            <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Error</span>(<span class="hljs-string">`HTTP-Fehler! Status: <span class="hljs-subst">${response.status}</span>`</span>);
        }        
        <span class="hljs-keyword">const</span> data = <span class="hljs-keyword">await</span> response.<span class="hljs-title function_">json</span>();
        <span class="hljs-keyword">return</span> data;
    } <span class="hljs-keyword">catch</span> (error) {<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">error</span>(<span class="hljs-string">&#x27;Fehler beim Geodaten-Abruf:&#x27;</span>, error.<span class="hljs-property">message</span>);}
}
</code></pre>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="61">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="%C3%BCbersicht-fetch--async--await">Übersicht: <code>fetch()</code> &amp; <code>async / await</code></h3>
<table>
<thead>
<tr>
<th style="text-align:left">Baustein</th>
<th style="text-align:left">Syntax / Befehl</th>
<th style="text-align:left">Zweck in der Praxis</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong><code>async</code></strong></td>
<td style="text-align:left"><code>async function ladeDaten() {..}</code></td>
<td style="text-align:left">Erlaubt die Nutzung von <code>await</code> in der Funktion</td>
</tr>
<tr>
<td style="text-align:left"><strong><code>fetch()</code></strong></td>
<td style="text-align:left"><code>await fetch('datei.geojson')</code></td>
<td style="text-align:left">Fordert Geodaten/APIs asynchron im <br /> Hintergrund an</td>
</tr>
<tr>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="clientseitige-speicherung--die-js-sandbox">Clientseitige Speicherung &amp; die JS-Sandbox</h3>
<p>JavaScript läuft aus Sicherheitsgründen in einer strikten <strong>Sandbox</strong> im Browser:</p>
<ul>
<li><strong>Sandbox-Prinzip (Same-Origin Policy):</strong>
<ul>
<li>Kein direkter, unkontrollierter Zugriff auf das lokale Dateisystem der Benutzer.</li>
<li>Daten sind isoliert pro Domäne/Protokoll gespeichert.</li>
</ul>
</li>
<li><strong>Web Storage API (Zwei Speicherarten):</strong>
<ul>
<li><strong><code>localStorage</code></strong>: Speichert Daten <strong>dauerhaft</strong> im Browser-Profil (übersteht Neustarts).</li>
<li><strong><code>sessionStorage</code></strong>: Speichert Daten <strong>temporär</strong> (wird beim Schließen des Tabs gelöscht).</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// Schlüssel-Wert-Paar dauerhaft ablegen</span>
<span class="hljs-variable language_">localStorage</span>.<span class="hljs-title function_">setItem</span>(<span class="hljs-string">&#x27;theme&#x27;</span>, <span class="hljs-string">&#x27;dark&#x27;</span>);
</code></pre>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="61">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="daten-serialisierung-mit-jsonstringify--jsonparse">Daten-Serialisierung mit <code>JSON.stringify</code> &amp; <code>JSON.parse</code></h3>
<p>Web Storage kann ausschließlich <strong>Strings</strong> speichern. Objekte müssen vorher umgewandelt werden!</p>
<ul>
<li><strong>Serialisierung (Objekt -&gt; String):</strong> <code>JSON.stringify(obj)</code></li>
<li><strong>Deserialisierung (String -&gt; Objekt):</strong> <code>JSON.parse(string)</code></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> userConfig = { <span class="hljs-attr">layer</span>: <span class="hljs-string">&#x27;OSM&#x27;</span>, <span class="hljs-attr">zoom</span>: <span class="hljs-number">12</span> };

<span class="hljs-comment">// 1. Objekt in JSON-String umwandeln &amp; speichern</span>
<span class="hljs-variable language_">localStorage</span>.<span class="hljs-title function_">setItem</span>(<span class="hljs-string">&#x27;userConfig&#x27;</span>, <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">stringify</span>(userConfig));

<span class="hljs-comment">// 2. String auslesen &amp; zurück in JS-Objekt verwandeln</span>
<span class="hljs-keyword">const</span> rawData = <span class="hljs-variable language_">localStorage</span>.<span class="hljs-title function_">getItem</span>(<span class="hljs-string">&#x27;userConfig&#x27;</span>);
<span class="hljs-keyword">const</span> configObj = <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">parse</span>(rawData);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(configObj.<span class="hljs-property">zoom</span>); <span class="hljs-comment">// 12</span>
</code></pre>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="moderne-web-apis-die-geolocation-api">Moderne Web APIs: Die Geolocation API</h3>
<p>Browser bieten viele eingebaute Schnittstellen (<strong>Web APIs</strong>), die speziell in der Geovisualisierung wichtig sind:</p>
<ul>
<li><strong><code>navigator.geolocation</code></strong>: Abfrage des aktuellen Benutzer-Standorts (GPS / IP / WLAN).</li>
<li><strong>Datenschutz &amp; Permission Model:</strong> Der Browser verlangt explizit die Zustimmung des Benutzers.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// Standort abfragen (asynchron per Callback)</span>
navigator.<span class="hljs-property">geolocation</span>.<span class="hljs-title function_">getCurrentPosition</span>(
    <span class="hljs-function">(<span class="hljs-params">position</span>) =&gt;</span> {
        <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;Breitengrad:&#x27;</span>, position.<span class="hljs-property">coords</span>.<span class="hljs-property">latitude</span>);
        <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;Längengrad:&#x27;</span>, position.<span class="hljs-property">coords</span>.<span class="hljs-property">longitude</span>);
    },
    <span class="hljs-function">(<span class="hljs-params">error</span>) =&gt;</span> <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">error</span>(<span class="hljs-string">&#x27;Standortfehler:&#x27;</span>, error.<span class="hljs-property">message</span>)
);
</code></pre>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="ki-gest%C3%BCtzte-entwicklung-mit-spec-driven-development-sdd">KI-gestützte Entwicklung mit Spec-Driven Development (SDD)</h3>
<p>Moderne KI-Tools (z. B. Antigravity, Cursor) revolutionieren die Webprogrammierung durch <strong>Spec-Driven Development (SDD)</strong>:</p>
<ul>
<li><strong>Das Prinzip: Spezifikation vor Code:</strong>
<ul>
<li>Statt vager Prompts (&quot;Mach mir eine Karte&quot;) wird zuerst eine präzise Spezifikation (<code>spec.md</code>) formuliert.</li>
<li>Die Spezifikation definiert Datenstrukturen (GeoJSON), Schnittstellen, Validierungsregeln und UX-Verhalten.</li>
</ul>
</li>
<li><strong>Vorteile für Einsteiger:</strong>
<ul>
<li>KI generiert sauberen, standardkonformen Code nach klaren Vorgaben.</li>
<li>Fehler lassen sich durch schrittweises Refactoring und Prompt-Iterationen gezielt beheben.</li>
</ul>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="formular-ereignisse-submit-input-change">Formular-Ereignisse (<code>submit</code>, <code>input</code>, <code>change</code>)</h3>
<p>Formulare in JavaScript reagieren auf verschiedene Interaktions-Ereignisse:</p>
<ul>
<li><strong><code>submit</code></strong>: Feuert beim Absenden (per Button oder Enter).
<ul>
<li>Wichtig: Stets <code>event.preventDefault()</code> aufrufen!</li>
</ul>
</li>
<li><strong><code>input</code></strong>: Feuert <strong>sofort bei jedem Tastendruck</strong> / Ändern des Textes.
<ul>
<li>Ideal für Live-Validierung, Zeichenzähler oder Echtzeit-Suchfilter.</li>
</ul>
</li>
<li><strong><code>change</code></strong>: Feuert beim Verlassen des Feldes (<code>blur</code>) oder bei Auswahl im Dropdown (<code>&lt;select&gt;</code>).</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// Live-Reaktion auf jeden Tastendruck im Textfeld</span>
inputElem.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&#x27;input&#x27;</span>, <span class="hljs-function">(<span class="hljs-params">e</span>) =&gt;</span> {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;Aktueller Text:&#x27;</span>, e.<span class="hljs-property">target</span>.<span class="hljs-property">value</span>);
});
</code></pre>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="die-formdata-api-kompakte-datenextraktion">Die <code>FormData</code>-API (Kompakte Datenextraktion)</h3>
<p>Statt jedes Formularfeld einzeln per <code>document.querySelector()</code> auszulesen, liest <code>FormData</code> das gesamte Formular automatisch auf einmal aus:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> form = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&#x27;#poiForm&#x27;</span>);

form.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&#x27;submit&#x27;</span>, <span class="hljs-function">(<span class="hljs-params">event</span>) =&gt;</span> {
    event.<span class="hljs-title function_">preventDefault</span>();
    
    <span class="hljs-comment">// 1. FormData aus dem Formular-Element erzeugen (erfordert name=&quot;...&quot; Attribute)</span>
    <span class="hljs-keyword">const</span> formData = <span class="hljs-keyword">new</span> <span class="hljs-title class_">FormData</span>(form);
    
    <span class="hljs-comment">// 2. Direkt in ein einfaches JavaScript-Objekt umwandeln</span>
    <span class="hljs-keyword">const</span> dataObjekt = <span class="hljs-title class_">Object</span>.<span class="hljs-title function_">fromEntries</span>(formData);
    
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(dataObjekt); <span class="hljs-comment">// { title: &#x27;Festung&#x27;, category: &#x27;sightseeing&#x27; }</span>
});
</code></pre>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="native-formularvalidierung-constraint-validation-api">Native Formularvalidierung (Constraint Validation API)</h3>
<p>Browser bieten eingebaute Prüfungen, um fehlerhafte Eingaben vor dem Absenden abzufangen:</p>
<ul>
<li><strong>HTML5-Attribute:</strong> <code>required</code>, <code>minlength=&quot;3&quot;</code>, <code>type=&quot;email&quot;</code>, <code>pattern=&quot;...&quot;</code></li>
<li><strong>JavaScript-Validierung:</strong>
<ul>
<li><strong><code>form.checkValidity()</code></strong>: Liefert <code>true</code>, wenn alle Felder gültig sind.</li>
<li><strong><code>input.validity.valid</code></strong>: Einzelstatus eines Feldes abfragen.</li>
<li><strong><code>form.reportValidity()</code></strong>: Stoppt den Ablauf und zeigt die HTML5-Fehlerblasen an.</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">if</span> (!form.<span class="hljs-title function_">checkValidity</span>()) {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;Formular ist unvollständig!&#x27;</span>);
    form.<span class="hljs-title function_">reportValidity</span>(); <span class="hljs-comment">// Fehlermeldungen anzeigen</span>
    <span class="hljs-keyword">return</span>;
}
</code></pre>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
