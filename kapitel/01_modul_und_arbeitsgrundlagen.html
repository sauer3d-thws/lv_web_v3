<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Digital Shepherd</strong></p>
<p>Egal welche Quelle genutzt wird: Der moderne Ansatz lautet &quot;Digital Shepherd&quot; (Digitaler Hirte). Man sollte Code (egal ob aus Tutorials, Foren oder von einer KI generiert) niemals blind kopieren. Die eigentliche Kompetenz liegt aktuell darin, den Code zu verstehen, seine Barrierefreiheit (z.B. korrekte Alt-Texte für Bilder), semantische Sauberkeit und Performance zu validieren, um langfristig wartbare Webprojekte aufzubauen.</p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="69" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;../img/digital_shepherd.png&quot;);"><figcaption>full:bg</figcaption></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="69" data-marpit-advanced-background="content">

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Digital Shepherd &amp; &quot;Vibe Coding&quot;</strong></p>
<ul>
<li><strong>Was ist Vibe-Coding?</strong> Das Programmieren mittels natürlicher Sprache und KI-Assistenten (man beschreibt die Absicht, die KI schreibt den Code).</li>
<li><strong>Die Verführung:</strong> Es fühlt sich einfach an (&quot;es läuft ja&quot;). Doch KI generiert oft Code, der oberflächlich funktioniert, aber unter der Haube erhebliche Defizite aufweist.</li>
<li><strong>Die Rolle des Hirten (Shepherd):</strong>
<ul>
<li>Prompting ersetzt kein Grundlagenwissen!</li>
<li>Wer die Grundlagen (HTML-Semantik, CSS-Kaskadierung, JS-Sicherheit) nicht versteht, kann den generierten Code weder korrigieren noch pflegen.</li>
<li>Der &quot;Digital Shepherd&quot; leitet die KI gezielt an, statt sich blind von ihr leiten zu lassen.</li>
</ul>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="69">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Die Auditing-Checkliste des Digital Shepherd</strong><br />
Wenn eine KI Code generiert, müssen Sie diesen stets kritisch auf folgende Kriterien prüfen:</p>
<ul>
<li><strong>Semantik &amp; Struktur:</strong> Nutzt der Code echte HTML5-Elemente (<code>&lt;main&gt;</code>, <code>&lt;article&gt;</code>, <code>&lt;header&gt;</code>) oder handelt es sich um eine unübersichtliche Verschachtelung reiner <code>&lt;div&gt;</code>-Elementen?</li>
<li><strong>Barrierefreiheit (Accessibility):</strong> Fehlen Alt-Attribute bei Bildern, korrekte Label-Zuordnungen bei Formularen oder barrierefreie Kontraste?</li>
<li><strong>Performance &amp; Overhead:</strong> Wurde unnötig komplexer Code vorgeschlagen, wo einfaches Vanilla-CSS/JS ausreicht?</li>
<li><strong>Sicherheit:</strong> Werden Eingaben ungeprüft verarbeitet oder veraltete/unsichere Methoden genutzt?</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="69">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Zukunftsperspektive: Vom Coder zum Architekten</strong><br />
Wie verändert sich die Rolle von Webentwicklern durch generative KI?</p>
<ul>
<li><strong>Der Wandel:</strong> Die reine Schreibarbeit (Syntax tippen) nimmt ab. Die Rolle verschiebt sich hin zum <strong>Systemarchitekten</strong> und <strong>Qualitätsprüfer</strong>.</li>
<li><strong>Menschliche Stärken:</strong> KI versteht selten den größeren geschäftlichen Kontext, Datenschutz-Anforderungen oder das emotionale Design-Gefühl für Benutzer.</li>
<li><strong>Fazit:</strong>
<ul>
<li>Reine &quot;Code-Kopierer&quot; werden durch KI ersetzt.</li>
<li><strong>Systemversteher</strong> und <strong>Digital Shepherds</strong>, die komplexe Systeme konzipieren, verifizieren und absichern können, sind gefragter denn je!</li>
</ul>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p>Da Maik ein mobiles Leben führt,<br />
ist er selten am gleichen Platz zu finden.<br />
Um ihn und seine Dienstleistungen dennoch<br />
auffinden zu können, benötigt er eine gut<br />
auffindbare Webseite mit seinen<br />
digitalen Kontaktdaten.</p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="32" style="" data-marpit-pagination-total="69" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="69">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="das-konzept">Das Konzept</h3>
<p>Bevor überhaupt eine einzige Zeile Code geschrieben wird, muss zuerst definiert werden, welche Ziele mit dem Webauftritt verfolgt werden.</p>
<blockquote>
<p><strong>Zieldefinition:</strong><br />
Webseiten-Ziele vor der Entwicklung festlegen.<br />
Am besten in einem Workshop oder Gespräch mit dem Auftraggeber.</p>
</blockquote>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="69">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<ul>
<li><strong>Fokus der Inhalte:</strong>
<ul>
<li>Präsentation von Maiks Dienstleistungen</li>
<li>Vermittlung des mobilen Lebensstils (Reisen, Alltag, Tauchlehrer)</li>
<li>Kontaktdaten gut auffindbar (schneller Kundenkontakt)</li>
</ul>
</li>
<li><strong>Visueller &amp; redaktioneller Ansatz:</strong>
<ul>
<li>Viele Bilder als roter Faden durch alle Bereiche</li>
<li>Reiseberichte für Mehrwert und bessere Auffindbarkeit</li>
</ul>
</li>
<li><strong>Technische Reduzierung:</strong>
<ul>
<li>Keine komplexe Technik (Webshops, Logins) für einfache Selbstpflege</li>
<li>Simple HTML-Webseite &gt; guter Hacker- &amp; Spam-Schutz</li>
</ul>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-class="structural" data-theme="thws-sts" lang="en-US" class="structural" data-marpit-pagination="35" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--class:structural;--theme:thws-sts;" data-marpit-pagination-total="69">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<h2 id="was-ist-gutes-webdesign">Was ist gutes Webdesign?</h2>
<ul>
<li>Gutes Webdesign ist zielgruppenorientiert</li>
<li>Gutes Webdesign ist benutzerfreundlich</li>
<li>Gutes Webdesign ist technisch einwandfrei</li>
<li>Gutes Webdesign ist &quot;responsive&quot;</li>
<li>Gutes Webdesign ist SEO-optimiert</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="69" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;../img/zielgruppenorientierung.jpeg&quot;);"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="36" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="69" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="zielguppenorientierung">Zielguppenorientierung</h3>
<ul>
<li><strong>Zentrale Kernfrage der Planung:</strong><br />
Wer sind die Besucher der Webseite?</li>
<li><strong>Zielgruppe bestimmt das Design:</strong><br />
Es gibt kein universell &quot;gutes&quot; Design<br />
(ob minimalistisch oder Vintage)<br />
es muss zur Zielgruppe passen.</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="36" style="" data-marpit-pagination-total="69" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="69">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<ul>
<li><strong>Einfluss demografischer Faktoren:</strong>
<ul>
<li><strong>Ältere Zielgruppen:</strong> Benötigen barrierefreies Design (z. B. größere Schriften), legen mehr Wert auf Inhalt und Seriosität als auf reines Styling.</li>
<li><strong>Jüngere Zielgruppen:</strong> Erwarten ein modernes &quot;Look and Feel&quot; und ein hochwertiges, visuelles Design.</li>
</ul>
</li>
<li><strong>Bedürfnisse &amp; Erwartungen:</strong> Die optische und inhaltliche Ausrichtung muss dem Thema entsprechen (z. B. NGO-Informationsseite vs. Lifestyle-Webshop).</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="69">

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="benutzerfreundlichkeit">Benutzerfreundlichkeit</h3>
<p><strong>Form follows function:</strong></p>
<blockquote>
<p>Jedes Design-Element muss optisch ansprechend und funktional sein.<br />
Kein Element ohne Funktion!</p>
</blockquote>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>

<li><strong>Typografie und Farbkontrast:</strong>
<ul>
<li>Typografie und Farben passend zur Corporate Identity.</li>
<li>Hohe Kontraste (z. B. schwarz auf weiß) und lesbare Schriftgrößen für unterschiedliche Sehstärken und Monitore.</li>
</ul>
</li>
<li><strong>Wirkung von Weißraum (Whitespace):</strong>
<ul>
<li>„Weniger ist mehr“: Weißraum strukturiert die Inhalte und lässt sie atmen.</li>
<li>Minimalistische Layouts wirken professionell und modern.</li>
</ul>
</li>
</ul>

<h3 id="technische-korrektheit">Technische Korrektheit</h3>
<ul>
<li><strong>Trennung von Inhalt &amp; Design:</strong>

<li>Erleichtert Suchmaschinen die optimale Indexierung (SEO).</li>
<li>Ermöglicht Barrierefreiheit<br />
(z. B. einfache Navigation für Screenreader).</li>
</ul>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="responsive-webdesign">Responsive Webdesign</h3>
<blockquote>
<p>64 Prozent des globalen Traffics stammt von Smartphones!<br />
Smartphones sind für 64 Prozent des gesamten Internetverkehrs verantwortlich. In Asien ist der Smartphone-Anteil am Traffic besonders hoch.<br />
</p>
</blockquote>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="44" style="" data-marpit-pagination-total="69" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="69">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<ul>
<li><strong>Definition:</strong> Flexibles Layout, bei dem sich Navigation, Inhalte und Struktur automatisch der Bildschirmauflösung des Endgeräts anpassen (Desktop, Tablet, Smartphone).</li>
<li><strong>Notwendigkeit:</strong> Smartphones sind ständiger Begleiter; über die Hälfte aller Nutzer surft mobil (Tendenz steigend).</li>
<li><strong>Ziel:</strong> Gewährleistung einer gleichwertigen Benutzerfreundlichkeit auf allen Gerätetypen.</li>
</ul>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Nutzererfahrung (UX) &amp; User Signals:</strong></p>
<ul>
<li>Intuitive Navigation erhöht die Verweildauer (Dwell Time) der Besucher.</li>
<li>Ansprechendes Design senkt die Absprungrate (Bounce Rate) – ein wichtiges Qualitätssignal für Google.</li>
<li><strong>Semantische Struktur &amp; Barrierefreiheit:</strong>
<ul>
<li>Sinnvolle Überschriftenhierarchien (H1-H6) und beschreibende Alt-Texte helfen Screenreadern <em>und</em> Suchmaschinen-Crawlern.</li>
</ul>
</li>
<li><strong>Saubere Codestruktur:</strong> Die klare Trennung von Inhalt (HTML) und Gestaltung (CSS) erleichtert Crawlern das effiziente Auslesen und Indexieren der Seite.</li>
</ul>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>20 Tips zur SEO-Optimierung:</strong></p>
<p><strong>Inhalt &amp; On-Page-Faktoren</strong></p>
<ol>
<li>Keyword-Recherche: Zielgerichtete Suchbegriffe identifizieren und passend einsetzen.</li>
<li>Einzigartiger Content: Hochwertige Inhalte mit echtem Mehrwert schaffen (Plagiate vermeiden).</li>
<li>Aussagekräftige Title-Tags: Wichtige Keywords an den Anfang setzen (max. 60 Zeichen).</li>
<li>Meta-Descriptions: Klickstarke, animierende Kurzzusammenfassungen schreiben.</li>
<li>Klare Überschriften (H1–H6): Strukturierte Text-Hierarchie mit Fokus-Keywords nutzen.</li>
</ol>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>

<li>Sprechende URLs: Lesbare, kurze und logische URL-Strukturen verwenden.</li>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="datenschutzerkl%C3%A4rung">Datenschutzerklärung</h3>
<blockquote>
<p>„Ich betreibe eine kleine Seite, auf der ich für meine Familie und Freunde Inhalte zu Verfügung stelle. Benötige ich für diese private Seite eine Datenschutzerklärung?“</p>
</blockquote>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="60" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="69">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Antwort:</strong><br />
Grundsätzlich gilt: Wer eine Webseite betreibt, muss mindestens die Informationen gem. <strong>§ 5 Abs. 1 DDG</strong> zur Verfügung stellen und über die Verarbeitung von personenbezogenen Daten informieren. Selbst wenn keine Analyse-Tools oder Kontaktformulare eingebaut sind, erfolgt beim Aufruf der Seite eine Datenverarbeitung, da der Webserver die <strong>IP-Adresse</strong> des Nutzers protokolliert (Server-Logfiles). Daher ist für so gut wie jede Webseite eine Datenschutzerklärung erforderlich, um den Informationspflichten der <strong>DSGVO</strong> nachzukommen.</p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="61" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="69">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Gesetzliche Grundlage:</strong> DSGVO (EU-Datenschutz-Grundverordnung) und BDSG (Bundesdatenschutzgesetz).</p>
<ul>
<li><strong>Wann benötigt?</strong> Praktisch immer! Sobald personenbezogene Daten verarbeitet werden.</li>
<li><strong>Schon gewusst?</strong> Bereits die Übermittlung und Speicherung der <strong>IP-Adresse</strong> in den Server-Logfiles beim Webseitenaufruf gilt als Datenverarbeitung.</li>
<li><strong>Fazit:</strong> Jede öffentliche Webseite braucht eine Datenschutzerklärung (Informationspflicht nach Art. 13 DSGVO).</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="62" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="69">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Typische Auslöser auf Webseiten</strong></p>
<p>Sobald mindestens eines der folgenden Elemente genutzt wird:</p>
<ul>
<li><strong>Kontaktformulare</strong> (E-Mail, Name)</li>
<li><strong>Webanalyse &amp; Tracking</strong> (Google Analytics, Matomo etc.)</li>
<li><strong>Social-Media-Anbindungen</strong> (Share-Buttons, Widgets)</li>
<li><strong>Externe Einbindungen</strong> (Google Fonts, YouTube-Videos, Maps)</li>
<li><strong>Newsletter-Registrierung</strong></li>
<li><strong>Cookies</strong> (zu Marketing- oder Analysezwecken)</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="63" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="69">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<blockquote>
<p>Muss ich dann zum Anwalt???</p>
</blockquote>
<p><strong>Im Zweifel ja!</strong></p>
<p>Aber:<br />
Eine Datenschutzerklärung wird häufig über einen Online-Generator erzeugt:</p>
<p><a href="https://datenschutz-generator.de/">https://datenschutz-generator.de/</a><br />
<a href="https://www.e-recht24.de/muster-datenschutzerklaerung.html">https://www.e-recht24.de/muster-datenschutzerklaerung.html</a></p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="64" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="69" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;../img/cookies.jpg&quot;);"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="64" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="64" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="69" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="cookies">Cookies</h3>
<p><strong>Definition:</strong><br />
Textdateien, die Informationen enthalten<br />
und im Browser gespeichert werden können.<br />
Sie dienen der Identifikation,<br />
dem Merken von Zuständen oder<br />
der Analyse des Nutzerverhaltens.<br />
</p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="64" style="" data-marpit-pagination-total="69" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="65" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="69">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Aufbau einer Cookie</strong></p>
<ul>
<li>Cookie vom Webserver an Browser</li>
<li>oder im Browser von Skript (JavaScript) erzeugt</li>
<li>Webserver kann bei späteren, erneuten Besuchen Cookie-Information direkt auslesen</li>
<li>oder über ein Skript der Website die Cookie-Information an den Server übertragen</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="66" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="69">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Aufgabe von Cookies:</strong></p>
<ul>
<li>Identifizierung des Surfers (Session ID)</li>
<li>Abspeichern eines Logins</li>
<li>Abspeichern eines Warenkorbs</li>
<li>Webtracking von Nutzern mit speziell präparierten Seiten.</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="67" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="69">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Brauche ich einen Cookie Warner?</strong></p>
<p><strong>Gesetzliche Grundlage:</strong> <strong>§ 25 TDDDG</strong> (Telekommunikation-Digitale-Dienste-Datenschutz-Gesetz).</p>
<ul>
<li><strong>Nein, wenn</strong> ausschließlich <strong>technisch notwendige Cookies</strong> verwendet werden (z. B. für Warenkörbe, Loginsessions, Sprachauswahl oder den Cookie-Banner selbst).</li>
<li><strong>Ja, wenn</strong> technisch <strong>nicht notwendige Cookies</strong> oder Skripte geladen werden (z. B. Tracking- &amp; Marketing-Tools, Google Analytics, YouTube-Embeds, Google Maps).</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="68" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="69">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Anforderungen an ein rechtskonformes Consent-Banner</strong></p>
<ul>
<li><strong>Aktive Einwilligung (Opt-In):</strong> Cookies dürfen erst nach aktiver Zustimmung des Nutzers gesetzt werden.</li>
<li><strong>Gleichwertigkeit:</strong> Der Button „Ablehnen“ muss auf derselben Ebene und visuell gleichwertig zum „Akzeptieren“-Button sein.</li>
<li><strong>Keine Voreinstellungen:</strong> Häkchen bei nicht notwendigen Diensten dürfen nicht vorab ausgefüllt sein.</li>
<li><strong>Transparenz:</strong> Vollständige Aufklärung über Anbieter, Zweck und Lebensdauer der gesetzten Cookies.</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="69" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="69">

</blockquote>

</section>
