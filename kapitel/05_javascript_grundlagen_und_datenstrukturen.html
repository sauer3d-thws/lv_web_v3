</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h4 id="was-javascript-kann">Was Javascript kann</h4>
<ul>
<li>kann komplette Anwendungen entwickeln</li>
<li>kann grafische Objekte manipulieren und animieren</li>
<li>kann Elemente dynamisieren</li>
<li>kann Daten zwischen Browser und Webserver austauschen,<br />
ohne dass Seite neu geladen werden muss</li>
<li>kann Daten auf dem Client speichern</li>
<li>kann lokalisierte Informationen anzeigen</li>
<li>kann Daten des Clientrechners auswerten und  Seiten und Inhalte an die Gegebenheiten des Besuchers anpassen</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h4 id="was-javascript-nicht-kann">Was Javascript nicht kann</h4>
<ul>
<li>keine Datenbank abfragen</li>
<li>keine Dateien auf dem Server speichern oder organisieren</li>
<li>kann keine Programme auf dem Server ausführen</li>
<li>kann keine Informationen aus anderen Webseiten abrufen, da diese mit CORS-Mechanismen geschützt sein können.</li>
<li>kann Standardmäßig nicht direkt auf das Dateisystem des Computers zugreifen (aus Sicherheitsgründen)</li>
<li>kann nicht direkt auf die Hardware des Computers zugreifen (aus Sicherheitsgründen)</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h4 id="javascript-und-sicherheit">Javascript und Sicherheit</h4>
<p>Früher war Javascript ein Sicherheitsrisiko.<br />
Heute ist es das nicht mehr. Die Programmiersprache<br />
wird von den Herstellern der Browser stark reglementiert.</p>
<blockquote>
<p>Javascript läuft also nur im &quot;Sandkasten&quot; (Sandbox) des Browsers!</p>
</blockquote>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h4 id="ecmascript-vs-javascript-engines">ECMAScript vs. JavaScript-Engines</h4>
<ul>
<li><strong>ECMAScript (ES):</strong> Der offizielle <strong>Bauplan</strong> (Standard &amp; Spezifikation)
<ul>
<li>Legt Regeln, Syntax und neue Features fest (z. B. ES6, <code>const</code>/<code>let</code>, Arrow Functions).</li>
<li>Sagt, <em>wie</em> JavaScript geschrieben werden muss.</li>
</ul>
</li>
<li><strong>JS-Engine:</strong> Der <strong>Motor</strong> (die Software im Browser)
<ul>
<li>Liest den JavaScript-Code und übersetzt ihn in Maschinencode (Ausführung).</li>
<li>Setzt den ECMAScript-Bauplan in der Praxis um.</li>
</ul>
</li>
<li><strong>Die bekanntesten Engines:</strong>
<ul>
<li><strong>V8:</strong> Google Chrome, Node.js, Microsoft Edge, Brave</li>
<li><strong>JavaScriptCore (Nitro):</strong> Apple Safari (iOS / macOS)</li>
<li><strong>SpiderMonkey:</strong> Mozilla Firefox</li>
</ul>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p>ECMAScript ist das <strong>Rezept</strong>,<br />
die JS-Engine ist der <strong>Koch</strong>,<br />
der das <strong>Gericht</strong> zubereitet!</p>
<blockquote>
<p>Javascript wird  zur Laufzeit von der JS-Engine des Browsers übersetzt, interpretiert und ausgeführt.</p>
</blockquote>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h4 id="entwicklertools--debugging">Entwicklertools &amp; Debugging</h4>
<p>Entwicklertools der Browser (Console, Sources, Debugging)</p>
<ul>
<li><strong>Überblick:</strong> Alle modernen Browser (Chrome, Firefox, Edge, Safari) bieten integrierte Entwicklerwerkzeuge (DevTools).</li>
<li><strong>Zugriff:</strong> Taste <code>F12</code> oder <code>Rechtsklick -&gt; Element untersuchen</code>.</li>
<li><strong>Die wichtigsten Tabs:</strong>
<ul>
<li><strong>Console:</strong> Interaktives Terminal für JS-Befehle, Fehlermeldungen &amp; Ausgaben (<code>console.log()</code>, <code>console.error()</code>).</li>
<li><strong>Sources:</strong> Einsicht in geladene <code>.js</code>-Dateien, Quellcode-Inspektion &amp; Breakpoints.</li>
<li><strong>Network:</strong> Überwachung aller Netzwerkanfragen (z. B. API-Aufrufe/Fetch).</li>
</ul>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<blockquote>
<p>Die DevTools sind das Röntgengerät des Webentwicklers – sie machen die unsichtbare Laufzeit im Browser sichtbar!</p>
</blockquote>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h4 id="breakpoint-debugging-code-anhalten--untersuchen">Breakpoint-Debugging: Code anhalten &amp; untersuchen</h4>
<ul>
<li><strong>Warum Breakpoints statt nur <code>console.log()</code>?</strong>
<ul>
<li><code>console.log()</code> vermüllt den Code und zeigt nur statische Momentaufnahmen.</li>
<li>Breakpoints halten das Programm zur Laufzeit in der JS-Engine an!</li>
</ul>
</li>
<li><strong>Workflow im Sources-Tab:</strong>
<ol>
<li>Klick auf die Zeilennummer im Code setzt einen <strong>Breakpoint</strong>.</li>
<li>Die Ausführung stoppt sofort, wenn die Zeile erreicht wird.</li>
<li><strong>Scope &amp; Inspector:</strong> Live-Einsicht in alle aktuellen Variablenwerte und den Aufrufstapel (Call Stack).</li>
</ol>
</li>

<ul>
<li><strong>Step Over (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="3.957ex" height="1.588ex" role="img" focusable="false" viewBox="0 -680 1749 702"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D439" d="M48 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q146 66 215 342T285 622Q285 629 281 629Q273 632 228 634H197Q191 640 191 642T193 659Q197 676 203 680H742Q749 676 749 669Q749 664 736 557T722 447Q720 440 702 440H690Q683 445 683 453Q683 454 686 477T689 530Q689 560 682 579T663 610T626 626T575 633T503 634H480Q398 633 393 631Q388 629 386 623Q385 622 352 492L320 363H375Q378 363 398 363T426 364T448 367T472 374T489 386Q502 398 511 419T524 457T529 475Q532 480 548 480H560Q567 475 567 470Q567 467 536 339T502 207Q500 200 482 200H470Q463 206 463 212Q463 215 468 234T473 274Q473 303 453 310T364 317H309L277 190Q245 66 245 60Q245 46 334 46H359Q365 40 365 39T363 19Q359 6 353 0H336Q295 2 185 2Q120 2 86 2T48 1Z"></path></g><g data-mml-node="mn" transform="translate(749,0)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z" transform="translate(500,0)"></path></g></g></g></svg></mjx-container>):</strong> Zur nächsten Zeile springen.</li>
<li><strong>Step Into (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="3.957ex" height="1.538ex" role="img" focusable="false" viewBox="0 -680 1749 680"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D439" d="M48 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q146 66 215 342T285 622Q285 629 281 629Q273 632 228 634H197Q191 640 191 642T193 659Q197 676 203 680H742Q749 676 749 669Q749 664 736 557T722 447Q720 440 702 440H690Q683 445 683 453Q683 454 686 477T689 530Q689 560 682 579T663 610T626 626T575 633T503 634H480Q398 633 393 631Q388 629 386 623Q385 622 352 492L320 363H375Q378 363 398 363T426 364T448 367T472 374T489 386Q502 398 511 419T524 457T529 475Q532 480 548 480H560Q567 475 567 470Q567 467 536 339T502 207Q500 200 482 200H470Q463 206 463 212Q463 215 468 234T473 274Q473 303 453 310T364 317H309L277 190Q245 66 245 60Q245 46 334 46H359Q365 40 365 39T363 19Q359 6 353 0H336Q295 2 185 2Q120 2 86 2T48 1Z"></path></g><g data-mml-node="mn" transform="translate(749,0)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z" transform="translate(500,0)"></path></g></g></g></svg></mjx-container>):</strong> In die Funktionsausführung hineinspringen.</li>
<li><strong>Resume (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="2.826ex" height="1.588ex" role="img" focusable="false" viewBox="0 -680 1249 702"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D439" d="M48 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q146 66 215 342T285 622Q285 629 281 629Q273 632 228 634H197Q191 640 191 642T193 659Q197 676 203 680H742Q749 676 749 669Q749 664 736 557T722 447Q720 440 702 440H690Q683 445 683 453Q683 454 686 477T689 530Q689 560 682 579T663 610T626 626T575 633T503 634H480Q398 633 393 631Q388 629 386 623Q385 622 352 492L320 363H375Q378 363 398 363T426 364T448 367T472 374T489 386Q502 398 511 419T524 457T529 475Q532 480 548 480H560Q567 475 567 470Q567 467 536 339T502 207Q500 200 482 200H470Q463 206 463 212Q463 215 468 234T473 274Q473 303 453 310T364 317H309L277 190Q245 66 245 60Q245 46 334 46H359Q365 40 365 39T363 19Q359 6 353 0H336Q295 2 185 2Q120 2 86 2T48 1Z"></path></g><g data-mml-node="mn" transform="translate(749,0)"><path data-c="38" d="M70 417T70 494T124 618T248 666Q319 666 374 624T429 515Q429 485 418 459T392 417T361 389T335 371T324 363L338 354Q352 344 366 334T382 323Q457 264 457 174Q457 95 399 37T249 -22Q159 -22 101 29T43 155Q43 263 172 335L154 348Q133 361 127 368Q70 417 70 494ZM286 386L292 390Q298 394 301 396T311 403T323 413T334 425T345 438T355 454T364 471T369 491T371 513Q371 556 342 586T275 624Q268 625 242 625Q201 625 165 599T128 534Q128 511 141 492T167 463T217 431Q224 426 228 424L286 386ZM250 21Q308 21 350 55T392 137Q392 154 387 169T375 194T353 216T330 234T301 253T274 270Q260 279 244 289T218 306L210 311Q204 311 181 294T133 239T107 157Q107 98 150 60T250 21Z"></path></g></g></g></svg></mjx-container>):</strong> Normale Programmausführung fortsetzen.</li>
</ul>
</li>
</ul>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h4 id="das-debugger-statement--konsole-fehler-verstehen">Das <code>debugger;</code>-Statement &amp; Konsole-Fehler verstehen</h4>
<ul>
<li><strong>Code-Stopp per Befehl:</strong>
<ul>
<li>Das Statement <code>debugger;</code> im JS-Code wirkt wie ein fest eingebauter Breakpoint (sofern die DevTools geöffnet sind).</li>
</ul>
</li>
<li><strong>Die 3 häufigsten JS-Fehler in der Console lesen:</strong>
<ul>
<li><strong>ReferenceError:</strong> Variable ist nicht deklariert oder falsch geschrieben (<code>x is not defined</code>).</li>
<li><strong>TypeError:</strong> Zugriff/Methode auf <code>null</code> oder <code>undefined</code> (<code>Cannot read properties of undefined</code>).</li>
<li><strong>SyntaxError:</strong> Code verstößt gegen die Syntaxregeln (z. B. fehlende Klammer <code>)</code>).</li>
</ul>
</li>
</ul>
<blockquote>
<p><strong>Praxis-Tipp:</strong> Ein Klick auf die Zeilennummer rechts neben der Fehlermeldung in der Konsole springt direkt zur Fehlerquelle im Sources-Tab!</p>
</blockquote>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h4 id="praxis-beispiel-zum-nachbasteln-bug-hunting">Praxis-Beispiel zum Nachbasteln: Bug-Hunting</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;calcBtn&quot;</span>&gt;</span>Summe berechnen<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;result&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">script</span>&gt;</span><span class="language-javascript">
  <span class="hljs-keyword">function</span> <span class="hljs-title function_">berechneSumme</span>(<span class="hljs-params">a, b</span>) {
    <span class="hljs-keyword">debugger</span>; <span class="hljs-comment">// Stoppt automatisch bei geöffneten DevTools!</span>
    <span class="hljs-keyword">return</span> a + b;
  }
  <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">getElementById</span>(<span class="hljs-string">&quot;calcBtn&quot;</span>).<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&quot;click&quot;</span>, <span class="hljs-function">() =&gt;</span> {
    <span class="hljs-keyword">let</span> eingabeA = <span class="hljs-string">&quot;5&quot;</span>; <span class="hljs-comment">// Achtung: Wert aus Input-Feld ist ein String!</span>
    <span class="hljs-keyword">let</span> eingabeB = <span class="hljs-number">10</span>;
    <span class="hljs-keyword">let</span> summe = <span class="hljs-title function_">berechneSumme</span>(eingabeA, eingabeB);
    <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">getElementById</span>(<span class="hljs-string">&quot;result&quot;</span>).<span class="hljs-property">innerText</span> = <span class="hljs-string">&quot;Ergebnis: &quot;</span> + summe;
  });
</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
</code></pre>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h4 id="schritt-f%C3%BCr-schritt-vorgehensweise-beim-debuggen">Schritt-für-Schritt: Vorgehensweise beim Debuggen</h4>
<ul>
<li><strong>1. DevTools öffnen:</strong> Seite laden und <code>F12</code> (oder <code>Rechtsklick -&gt; Untersuchen</code>) drücken.</li>
<li><strong>2. Aktion ausführen:</strong> Klick auf den Button &quot;Summe berechnen&quot;.
<ul>
<li><img class="emoji" draggable="false" alt="🛑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6d1.svg" data-marp-twemoji=""/> Browser stoppt automatisch bei <code>debugger;</code> in der Funktion <code>berechneSumme()</code>.</li>
</ul>
</li>
<li><strong>3. Variablen inspizieren (Sources-Tab -&gt; Scope):</strong>
<ul>
<li>Fahre mit der Maus über <code>a</code> und <code>b</code> oder prüfe das <strong>Scope-Panel</strong>.</li>
<li>Erkenne den Typ: <code>a = &quot;5&quot;</code> (String) vs. <code>b = 10</code> (Number).</li>
</ul>
</li>
<li><strong>4. Fehlerursache:</strong> <code>a + b</code> führt wegen String-Konkatenation zu <code>&quot;510&quot;</code> statt <code>15</code>.</li>
<li><strong>5. Live-Fix in der Console testen:</strong> In der Konsole <code>Number(a) + b</code> ausführen -&gt; <code>15</code>.</li>
</ul>

</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-class="fullscreen" data-theme="thws-sts" lang="en-US" class="fullscreen" data-marpit-pagination="17" style="" data-marpit-pagination-total="71" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h4 id="der-didaktische-debugging-workflow">Der didaktische Debugging-Workflow</h4>
<ul>
<li><strong>1. Konsole prüfen:</strong> Gibt es rote Fehlermeldungen (z. B. <code>TypeError</code>)?</li>
<li><strong>2. Breakpoint setzen:</strong> Zeilennummer im <em>Sources-Tab</em> anklicken oder <code>debugger;</code> einbauen.</li>
<li><strong>3. Variablenzustand durchleuchten:</strong> Werte im <em>Scope</em>-Fenster zur Laufzeit analysieren.</li>
<li><strong>4. Code Schritt für Schritt ausführen:</strong> Mit <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="3.957ex" height="1.588ex" role="img" focusable="false" viewBox="0 -680 1749 702"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D439" d="M48 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q146 66 215 342T285 622Q285 629 281 629Q273 632 228 634H197Q191 640 191 642T193 659Q197 676 203 680H742Q749 676 749 669Q749 664 736 557T722 447Q720 440 702 440H690Q683 445 683 453Q683 454 686 477T689 530Q689 560 682 579T663 610T626 626T575 633T503 634H480Q398 633 393 631Q388 629 386 623Q385 622 352 492L320 363H375Q378 363 398 363T426 364T448 367T472 374T489 386Q502 398 511 419T524 457T529 475Q532 480 548 480H560Q567 475 567 470Q567 467 536 339T502 207Q500 200 482 200H470Q463 206 463 212Q463 215 468 234T473 274Q473 303 453 310T364 317H309L277 190Q245 66 245 60Q245 46 334 46H359Q365 40 365 39T363 19Q359 6 353 0H336Q295 2 185 2Q120 2 86 2T48 1Z"></path></g><g data-mml-node="mn" transform="translate(749,0)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z" transform="translate(500,0)"></path></g></g></g></svg></mjx-container> (Step Over) den Ablauf kontrollieren.</li>
<li><strong>5. Fehler beheben:</strong> Typumwandlung ergänzen (<code>Number(...)</code>) &amp; Code korrigieren.</li>
</ul>
<blockquote>
<p>Debuggen ist systematische Hypothesenprüfung – nicht Raten!</p>
</blockquote>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="einbindung-von-javascript">Einbindung von Javascript</h3>
<p>Saubere Einbindung im HTML: <script defer> und ES-Module (type=&quot;module&quot;)</p>
<ul>
<li><strong>Drei Wege zur Einbindung:</strong> Inline (veraltet), Intern (<code>&lt;script&gt;</code>), Extern (<code>&lt;script src=&quot;...&quot;&gt;</code>).</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h4 id="die-3-arten-der-javascript-einbindung">Die 3 Arten der JavaScript-Einbindung</h4>
<ol>
<li><strong>Inline-Event-Handler (Veraltet / No-Go):</strong>
<ul>
<li><code>&lt;button onclick=&quot;alert('Hallo!')&quot;&gt;Klick&lt;/button&gt;</code></li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Vermischt HTML &amp; Logik, schwer wartbar, Sicherheitsrisiken.</li>
</ul>
</li>
<li><strong>Internes Skript (<code>&lt;script&gt;</code>-Tag im HTML):</strong>
<ul>
<li><code>&lt;script&gt; console.log(&quot;Hallo Welt&quot;); &lt;/script&gt;</code></li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Gut für kleine Test-Skripte &amp; Demos. <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Nicht wiederverwendbar.</li>
</ul>
</li>
<li><strong>Externes Skript (Standard &amp; Best Practice):</strong>
<ul>
<li><code>&lt;script src=&quot;app.js&quot;&gt;&lt;/script&gt;</code></li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>Saubere Trennung</strong>, Browser-Caching, wiederverwendbar.</li>
</ul>
</li>
</ol>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h4 id="vergleich-vor--und-nachteile-der-einbindung">Vergleich: Vor- und Nachteile der Einbindung</h4>
<table>
<thead>
<tr>
<th style="text-align:left">Methode</th>
<th style="text-align:left">Beispiel</th>
<th style="text-align:left">Vorteile</th>
<th style="text-align:left">Nachteile</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Inline</strong> <em>(veraltet)</em></td>
<td style="text-align:left"><code>onclick=&quot;...&quot;</code></td>
<td style="text-align:left">Schnell für 1-Zeiler</td>
<td style="text-align:left">Vermischt HTML &amp; JS, kein Caching, Sicherheitsrisiko</td>
</tr>
<tr>
<td style="text-align:left"><strong>Intern</strong></td>
<td style="text-align:left"><code>&lt;script&gt;...&lt;/script&gt;</code></td>
<td style="text-align:left">Kein Extra-HTTP-Request</td>
<td style="text-align:left">Kein Caching für JS, macht HTML unübersichtlich</td>
</tr>
<tr>
<td style="text-align:left"><strong>Extern</strong> <em>(Standard)</em></td>
<td style="text-align:left"><code>&lt;script src=&quot;...&quot;&gt;&lt;/script&gt;</code></td>
<td style="text-align:left"><strong>Wiederverwendbar</strong>, <strong>Browser-Caching</strong>, saubere Struktur</td>
<td style="text-align:left">Benötigt Netzwerk-Request (gecached)</td>
</tr>
</tbody>
</table>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Grundregel:</strong><br />
Trenne immer:</p>
<ul>
<li>Inhalt (HTML)</li>
<li>Layout (CSS)</li>
<li>Verhalten (JS)</li>
</ul>
<p><strong>Hinweis:</strong><br />
Veraltete Attribute wie <strong>language=&quot;javascript&quot;</strong><br />
werden nicht mehr genutzt.</p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="ladeverhalten-optimieren-das-defer-attribut">Ladeverhalten optimieren: Das <code>defer</code>-Attribut</h3>
<ul>
<li><strong>Klassisches Verhalten (ohne Attribut):</strong>
<ul>
<li>Skript lädt &amp; führt sofort aus -&gt; <strong>blockiert das Parsen des HTML-DOMs</strong>.</li>
</ul>
</li>
<li><strong>Die moderne Lösung: <code>&lt;script defer src=&quot;app.js&quot;&gt;</code></strong>
<ul>
<li><strong><code>defer</code> (Aufschieben):</strong> Lädt das Skript im Hintergrund herunter.</li>
<li>Ausführung erfolgt <strong>erst, nachdem das HTML vollständig aufgebaut (geparst) ist</strong>.</li>
<li>Garantiert die korrekte Ausführungsreihenfolge mehrerer Skripte.</li>
</ul>
</li>
<li><strong>Unterschied zu <code>async</code>:</strong>
<ul>
<li><code>async</code> führt das Skript sofort nach dem Download aus (gut für unabhängige Analyse-Tools).</li>
</ul>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<blockquote>
<p><strong>Best Practice:</strong><br />
Platziere externe Skripte im <head> und nutze immer defer!</p>
</blockquote>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="modern--modular-es-module-typemodule">Modern &amp; Modular: ES-Module (<code>type=&quot;module&quot;</code>)</h3>
<ul>
<li><strong>Einbindung:</strong>
<ul>
<li><code>&lt;script type=&quot;module&quot; src=&quot;app.js&quot;&gt;&lt;/script&gt;</code></li>
</ul>
</li>
<li><strong>Die wichtigsten Eigenschaften von ES-Modulen:</strong>
<ul>
<li><strong><code>import</code> &amp; <code>export</code>:</strong> Code lässt sich in wiederverwendbare Dateien aufteilen.</li>
<li><strong>Automatisches <code>defer</code>:</strong> Modul-Skripte werden standardmäßig aufschiebend geladen.</li>
<li><strong>Eigener Scope:</strong> Variablen verschmutzen nicht den globalen <code>window</code>-Namensraum.</li>
<li><strong>Strict Mode:</strong> Läuft automatisch im modernen <code>&quot;use strict&quot;</code>-Modus.</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// math.js (Funktion exportieren)</span>
<span class="hljs-keyword">export</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">summe</span>(<span class="hljs-params">a, b</span>) { <span class="hljs-keyword">return</span> a + b; }

<span class="hljs-comment">// app.js (Funktion importieren &amp; nutzen)</span>
<span class="hljs-keyword">import</span> { summe } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;./math.js&#x27;</span>;
</code></pre>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="praxis-beispiel-modularer-code-calculatorjs">Praxis-Beispiel: Modularer Code (<code>calculator.js</code>)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// calculator.js (Hilfsmodul)</span>

<span class="hljs-comment">// Privat: Nicht exportiert -&gt; Von außen unsichtbar!</span>
<span class="hljs-keyword">function</span> <span class="hljs-title function_">formatierErgebnis</span>(<span class="hljs-params">wert</span>) {
    <span class="hljs-keyword">return</span> <span class="hljs-string">`[Ergebnis: <span class="hljs-subst">${wert}</span>]`</span>;
}

<span class="hljs-comment">// Öffentlich: Durch &#x27;export&#x27; für andere Dateien verfügbar</span>
<span class="hljs-keyword">export</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">addieren</span>(<span class="hljs-params">a, b</span>) {
    <span class="hljs-keyword">return</span> <span class="hljs-title function_">formatierErgebnis</span>(<span class="hljs-title class_">Number</span>(a) + <span class="hljs-title class_">Number</span>(b));
}

<span class="hljs-keyword">export</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">subtrahieren</span>(<span class="hljs-params">a, b</span>) {
    <span class="hljs-keyword">return</span> <span class="hljs-title function_">formatierErgebnis</span>(<span class="hljs-title class_">Number</span>(a) - <span class="hljs-title class_">Number</span>(b));
}
</code></pre>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="hauptskript--html-einbindung-mainjs--html">Hauptskript &amp; HTML-Einbindung (<code>main.js</code> &amp; HTML)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// main.js (Hauptprogramm)</span>
<span class="hljs-keyword">import</span> { addieren, subtrahieren } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;./calculator.js&#x27;</span>;

<span class="hljs-variable language_">document</span>.<span class="hljs-title function_">getElementById</span>(<span class="hljs-string">&#x27;addBtn&#x27;</span>).<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&#x27;click&#x27;</span>, <span class="hljs-function">() =&gt;</span> {
    <span class="hljs-keyword">const</span> valA = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">getElementById</span>(<span class="hljs-string">&#x27;numA&#x27;</span>).<span class="hljs-property">value</span>;
    <span class="hljs-keyword">const</span> valB = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">getElementById</span>(<span class="hljs-string">&#x27;numB&#x27;</span>).<span class="hljs-property">value</span>;
    <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">getElementById</span>(<span class="hljs-string">&#x27;output&#x27;</span>).<span class="hljs-property">innerText</span> = <span class="hljs-title function_">addieren</span>(valA, valB);
});
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-comment">&lt;!-- HTML-Einbindung: type=&quot;module&quot; aktiviert import/export --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">script</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;module&quot;</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;main.js&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
</code></pre>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="variablen-deklarieren-const-vs-let-vs-var">Variablen deklarieren: <code>const</code> vs. <code>let</code> (vs. <code>var</code>)</h3>
<ul>
<li><strong><code>const</code> (Standard):</strong>
<ul>
<li>Für Variablen, deren Referenz <strong>nicht verändert</strong> wird.</li>
<li>Verhindert unbeabsichtigtes Überschreiben (<code>const pi = 3.14159;</code>).</li>
</ul>
</li>
<li><strong><code>let</code> (Veränderlich):</strong>
<ul>
<li>Für Variablen, deren Wert sich <strong>später ändert</strong> (z. B. Zähler in Schleifen).</li>
<li>Gültig nur im jeweiligen Code-Block (<em>Block Scope</em> <code>{ ... }</code>).</li>
</ul>
</li>
<li><strong><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Entfall: Kein <code>var</code> mehr nutzen!</strong>
<ul>
<li><code>var</code> hat keinen Block-Scope und leidet unter <em>Hoisting</em> (Hochziehen von Variablen). Führt in der Praxis zu schwer auffindbaren Bugs.</li>
</ul>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="was-ist-hoisting-hochziehen">Was ist Hoisting (&quot;Hochziehen&quot;)?</h3>
<p>Die JS-Engine zieht Deklarationen vor der Ausführung gedanklich an den Anfang des Scopes:</p>
<ul>
<li><strong><code>var</code> (Gefährlich):</strong>
<ul>
<li>Deklaration wird hochgezogen, Zuweisung bleibt stehen<br />
➔ Zugriff vor Zeile ergibt <code>undefined</code> (kein Fehler!).</li>
</ul>
</li>
<li><strong><code>let</code> &amp; <code>const</code> (Sicher):</strong>
<ul>
<li>Liegen vor der Zuweisungszeile in der <strong>Temporal Dead Zone (TDZ)</strong><br />
➔ Zugriff erzeugt einen sauberen <code>ReferenceError</code>.</li>
</ul>
</li>
<li><strong><code>function</code> (Bequem):</strong>
<ul>
<li>Werden komplett hochgezogen ➔ Können im Code auch oberhalb ihrer Definition aufgerufen werden.</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(a); <span class="hljs-comment">// undefined (mit var)</span>
<span class="hljs-keyword">var</span> a = <span class="hljs-number">5</span>;

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(b); <span class="hljs-comment">// ReferenceError: Cannot access &#x27;b&#x27; before initialization</span>
<span class="hljs-keyword">let</span> b = <span class="hljs-number">10</span>;
</code></pre>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<blockquote>
<p><strong>Regel:</strong> Nutze immer <em>const</em>. Erst wenn der Wert neu zugewiesen werden muss, ändere es zu <em>let</em>!</p>
</blockquote>
<p>Weitere Informationen unter:<br />
<a href="https://www.cancode.de/blog-article/die-eigenheiten-von-var-let-und-const-in-javascript">https://www.cancode.de/blog-article/die-eigenheiten-von-var-let-und-const-in-javascript</a></p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="die-7-primitiven-datentypen-in-javascript">Die 7 primitiven Datentypen in JavaScript</h3>
<p>Primitive Daten sind <strong>unveränderlich</strong> (<em>immutable</em>) und werden direkt als Wert gespeichert:</p>
<ol>
<li><strong><code>string</code></strong>: Textdaten (<code>&quot;Hallo&quot;</code>, <code>'Welt'</code>)</li>
<li><strong><code>number</code></strong>: Zahlen &amp; Kommazahlen (<code>42</code>, <code>3.14</code>, <code>NaN</code>)</li>
<li><strong><code>boolean</code></strong>: Wahrheitswerte (<code>true</code> / <code>false</code>)</li>
<li><strong><code>undefined</code></strong>: Variable deklariert, aber noch kein Wert zugewiesen (<code>let x;</code>)</li>
<li><strong><code>null</code></strong>: Bewusste Abwesenheit eines Werts (<code>const daten = null;</code>)</li>
<li><strong><code>bigint</code></strong>: Beliebig große Ganzzahlen (<code>9007199254740991n</code>)</li>
<li><strong><code>symbol</code></strong>: Eindeutiger Identifikator (<code>Symbol(&quot;id&quot;)</code>)</li>
</ol>
<p>Typprüfung im Code mit dem Operator <code>typeof</code> (z. B. <code>typeof &quot;Hallo&quot;</code> ➔ <code>&quot;string&quot;</code>).</p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="vergleiche-strikte--vs-lose--gleichheit">Vergleiche: Strikte (<code>===</code>) vs. Lose (<code>==</code>) Gleichheit</h3>
<ul>
<li><strong>Lose Gleichheit (<code>==</code>): Gefährlich!</strong>
<ul>
<li>Führt eine <strong>automatische Typkonvertierung</strong> (<em>Type Coercion</em>) durch.</li>
<li><code>&quot;5&quot; == 5</code> ➔ <code>true</code> | <code>0 == false</code> ➔ <code>true</code> | <code>&quot;&quot; == 0</code> ➔ <code>true</code></li>
</ul>
</li>
<li><strong>Strikte Gleichheit (<code>===</code>): Best Practice!</strong>
<ul>
<li>Vergleicht <strong>Wert UND Datentyp</strong> (ohne implizite Typumwandlung).</li>
<li><code>&quot;5&quot; === 5</code> ➔ <code>false</code> <em>(String vs. Number)</em></li>
<li><code>5 === 5</code> ➔ <code>true</code></li>
</ul>
</li>
</ul>
<blockquote>
<p><strong>Merksatz:</strong> Verwende in JavaScript immer <code>===</code> und <code>!==</code>, um unerwartete Typ-Bugs zu vermeiden!</p>
</blockquote>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="praxis-check-datentypen--vergleiche-in-der-konsole">Praxis-Check: Datentypen &amp; Vergleiche in der Konsole</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> name = <span class="hljs-string">&quot;Anna&quot;</span>;   <span class="hljs-comment">// String</span>
<span class="hljs-keyword">let</span> alter = <span class="hljs-number">22</span>;        <span class="hljs-comment">// Number</span>
<span class="hljs-keyword">let</span> istStudent = <span class="hljs-literal">true</span>; <span class="hljs-comment">// Boolean</span>

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-keyword">typeof</span> name);  <span class="hljs-comment">// &quot;string&quot;</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-keyword">typeof</span> alter); <span class="hljs-comment">// &quot;number&quot;</span>

<span class="hljs-comment">// Vergleichstest:</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;22&quot;</span> == alter);  <span class="hljs-comment">// true  (Lose Gleichheit -&gt; Typumwandlung!)</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;22&quot;</span> === alter); <span class="hljs-comment">// false (Strikte Gleichheit -&gt; Sicherer Standard!)</span>
</code></pre>
<blockquote>
<p><strong>Sonderfall / Kuriosität:</strong> <code>typeof null</code> gibt historisch bedingt <code>&quot;object&quot;</code> zurück (bekannter JS-Bug seit 1995).</p>
</blockquote>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="string-verarbeitung--template-literals">String-Verarbeitung &amp; Template Literals</h3>
<p>Strings erstellen und verarbeiten (Eigenschaften &amp; Methoden)</p>
<p><strong>Übersicht:</strong><br />
-Nützliche String-Methoden</p>
<ul>
<li>Template Literals (Backticks)</li>
<li>mehrzeilige Strings.</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="strings-verarbeiten-wichtige-eigenschaften--methoden">Strings verarbeiten: Wichtige Eigenschaften &amp; Methoden</h3>
<p>Strings sind Zeichenketten mit vielen eingebauten Hilfsmitteln:</p>
<ul>
<li><strong><code>text.length</code></strong>: Anzahl der Zeichen im String (<code>&quot;Hallo&quot;.length</code> ➔ <code>5</code>).</li>
<li><strong><code>text.toUpperCase()</code> / <code>.toLowerCase()</code></strong>: Wandelt den Text um (<code>&quot;hi&quot;.toUpperCase()</code> ➔ <code>&quot;HI&quot;</code>).</li>
<li><strong><code>text.includes(&quot;web&quot;)</code></strong>: Prüft, ob ein Teiltext enthalten ist (liefert <code>true</code> / <code>false</code>).</li>
<li><strong><code>text.trim()</code></strong>: Entfernt Leerzeichen am Anfang und Ende.</li>
<li><strong><code>text.slice(0, 4)</code></strong>: Schneidet einen Teilstring heraus (<code>&quot;JavaScript&quot;.slice(0, 4)</code> ➔ <code>&quot;Java&quot;</code>).</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="template-literals-die-macht-der-backticks">Template Literals: Die Macht der Backticks (<code>`</code>)</h3>
<p>Mit Backticks (<code>`...`</code>) werden Strings dynamisch und lesbar:</p>
<ul>
<li><strong>String-Interpolation (<code>${...}</code>):</strong>
<ul>
<li>Bette Variablen &amp; Ausdrücke direkt im Text ein: <code>`Preis: ${preis * 1.19} €`</code>.</li>
</ul>
</li>
<li><strong>Mehrzeilige Strings (Multiline):</strong>
<ul>
<li>Zeilenumbrüche können direkt im Code getippt werden (kein <code>\n</code> erforderlich!).</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> name = <span class="hljs-string">&quot;Alex&quot;</span>;
<span class="hljs-keyword">const</span> punkte = <span class="hljs-number">42</span>;

<span class="hljs-comment">// Dynamisch &amp; Mehrzeilig:</span>
<span class="hljs-keyword">const</span> nachricht = <span class="hljs-string">`Hallo <span class="hljs-subst">${name}</span>,
willkommen zurück! 
Deine Punkte: <span class="hljs-subst">${punkte}</span>`</span>;
</code></pre>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="vorher-vs-nachher--konkatenation-vs-backticks">Vorher vs. Nachher: <code>+</code>-Konkatenation vs. Backticks</h3>
<ul>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>Veraltet (unübersichtliche <code>+</code>-Verknüpfung):</strong><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> info = <span class="hljs-string">&quot;User: &quot;</span> + vorname + <span class="hljs-string">&quot; &quot;</span> + namename + <span class="hljs-string">&quot; (&quot;</span> + alter + <span class="hljs-string">&quot; Jahre)&quot;</span>;
</code></pre>
</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>Modern &amp; Sauber (Template Literals):</strong><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> info = <span class="hljs-string">`User: <span class="hljs-subst">${vorname}</span> <span class="hljs-subst">${namename}</span> (<span class="hljs-subst">${alter}</span> Jahre)`</span>;
</code></pre>
</li>
</ul>
<blockquote>
<p><strong>Regel:</strong> Nutze für jeden zusammengesetzten oder mehrzeiligen Text immer Template Literals (Backticks)!</p>
</blockquote>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-class="structural" data-theme="thws-sts" lang="en-US" class="structural" data-marpit-pagination="40" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--class:structural;--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<h2 id="kontrollstrukturen-funktionen--scope">Kontrollstrukturen, Funktionen &amp; Scope</h2>
<h3 id="kontrollstrukturen--entscheidungen">Kontrollstrukturen &amp; Entscheidungen</h3>
<p><strong>Übersicht:</strong></p>
<ul>
<li>Verzweigungen (<code>if/else</code>)</li>
<li>Mehrfachauswahl (<code>switch/case</code>)</li>
<li>ternärer Operator (<code>? :</code>).</li>
</ul>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="verzweigungen-if-else-if-und-else">Verzweigungen: <code>if</code>, <code>else if</code> und <code>else</code></h3>
<p>Steuere den Programmfluss basierend auf Wahrheitswerten (<code>true</code> / <code>false</code>):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> alter = <span class="hljs-number">18</span>;

<span class="hljs-keyword">if</span> (alter &gt;= <span class="hljs-number">18</span>) {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Volljährig: Zutritt gestattet.&quot;</span>);
} <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (alter &gt;= <span class="hljs-number">16</span>) {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Zutritt in Begleitung gestattet.&quot;</span>);
} <span class="hljs-keyword">else</span> {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Kein Zutritt.&quot;</span>);
}
</code></pre>
<ul>
<li><strong>Ablauf:</strong> Bedingungen werden sequenziell von oben nach unten geprüft.</li>
<li><strong>Logik:</strong> Sobald eine Bedingung <code>true</code> ergibt, wird dieser Block ausgeführt und der Rest übersprungen.</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="mehrfachauswahl-switch--case">Mehrfachauswahl: <code>switch</code> / <code>case</code></h3>
<p>Ideal, wenn eine einzelne Variable auf <strong>mehrere konkrete Werte</strong> geprüft werden soll:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> rolle = <span class="hljs-string">&quot;admin&quot;</span>;

<span class="hljs-keyword">switch</span> (rolle) {
    <span class="hljs-keyword">case</span> <span class="hljs-string">&quot;admin&quot;</span>:
        <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Vollzugriff gewährt.&quot;</span>);
        <span class="hljs-keyword">break</span>; <span class="hljs-comment">// Verhindert das Durchfallen in den nächsten Case!</span>
    <span class="hljs-keyword">case</span> <span class="hljs-string">&quot;editor&quot;</span>:
        <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Inhalte bearbeiten erlaubt.&quot;</span>);
        <span class="hljs-keyword">break</span>;
    <span class="hljs-attr">default</span>:
        <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Standard: Nur Lesezugriff.&quot;</span>);
}
</code></pre>
<blockquote>
<p><strong>Wichtig:</strong> Ohne <em>break</em>; führt JS automatisch die darunterliegenden <em>case</em>-Blöcke aus (<em>Fallthrough</em>).</p>
</blockquote>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="der-tern%C3%A4re-operator-bedingung--wert1--wert2">Der Ternäre Operator (<em>Bedingung ? Wert1 : Wert2</em>)</h3>
<p>Kompakte Kurzschreibweise für einfache <code>if / else</code>-Entscheidungen, die einen Wert zurückliefern:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> alter = <span class="hljs-number">20</span>;

<span class="hljs-comment">// Klassisch (if / else):</span>
<span class="hljs-keyword">let</span> statusText;
<span class="hljs-keyword">if</span> (alter &gt;= <span class="hljs-number">18</span>) { statusText = <span class="hljs-string">&quot;Erwachsen&quot;</span>; } <span class="hljs-keyword">else</span> { statusText = <span class="hljs-string">&quot;Minderjährig&quot;</span>; }

<span class="hljs-comment">// Elegant mit Ternärem Operator:</span>
<span class="hljs-keyword">const</span> statusText = alter &gt;= <span class="hljs-number">18</span> ? <span class="hljs-string">&quot;Erwachsen&quot;</span> : <span class="hljs-string">&quot;Minderjährig&quot;</span>;
</code></pre>
<blockquote>
<p><strong>Best Practice:</strong> Nutze den ternären Operator für prägnante Einzeiler. Vermeide Schachtelungen!</p>
</blockquote>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="praxis-beispiel-kombination-aller-3-entscheidungen">Praxis-Beispiel: Kombination aller 3 Entscheidungen</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// 1. IF / ELSE IF / ELSE: Bereichsprüfung (Alter)</span>
<span class="hljs-keyword">if</span> (alter &lt; <span class="hljs-number">6</span>) { basispreis = <span class="hljs-number">0</span>; }
<span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (alter &lt; <span class="hljs-number">18</span>) { basispreis = <span class="hljs-number">8.00</span>; } <span class="hljs-comment">// Ermäßigt</span>
<span class="hljs-keyword">else</span> { basispreis = <span class="hljs-number">12.00</span>; }               <span class="hljs-comment">// Standard</span>

<span class="hljs-comment">// 2. SWITCH / CASE: Exakter Abgleich (Wochentag)</span>
<span class="hljs-keyword">switch</span> (tag) {
    <span class="hljs-keyword">case</span> <span class="hljs-string">&quot;Dienstag&quot;</span>: endpreis = basispreis * <span class="hljs-number">0.8</span>; <span class="hljs-keyword">break</span>; <span class="hljs-comment">// Kinotag</span>
    <span class="hljs-keyword">case</span> <span class="hljs-string">&quot;Mittwoch&quot;</span>: endpreis = basispreis - <span class="hljs-number">2.0</span>; <span class="hljs-keyword">break</span>; <span class="hljs-comment">// Studententag</span>
    <span class="hljs-attr">default</span>: endpreis = basispreis; <span class="hljs-keyword">break</span>;
}

<span class="hljs-comment">// 3. TERNÄRER OPERATOR: Einzeiler für Statusmeldung</span>
<span class="hljs-keyword">const</span> seatText = isVip ? <span class="hljs-string">&quot;VIP-Lounge (+ 5 €)&quot;</span> : <span class="hljs-string">&quot;Standard-Platz&quot;</span>;
</code></pre>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h2 id="schleifen--moderne-iteration">Schleifen &amp; moderne Iteration</h2>
<p><strong>Klassische Schleifen:</strong></p>
<ul>
<li>for</li>
<li>while</li>
<li>do-while</li>
</ul>
<p><strong>Moderne Iteration:</strong></p>
<ul>
<li>for...of für Werte</li>
<li>for...in für Objekteigenschaften</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="klassische-schleifen-for-while--do-while">Klassische Schleifen: <code>for</code>, <code>while</code> &amp; <code>do-while</code></h3>
<ul>
<li><strong>Zählschleife (<code>for</code>):</strong> Bekannte Anzahl an Durchläufen.<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">for</span> (<span class="hljs-keyword">let</span> i = <span class="hljs-number">0</span>; i &lt; <span class="hljs-number">3</span>; i++) {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Durchlauf: <span class="hljs-subst">${i}</span>`</span>); <span class="hljs-comment">// 0, 1, 2</span>
}
</code></pre>
</li>
<li><strong>Kopfgesteuerte Schleife (<code>while</code>):</strong> Prüft Bedingung <strong>vor</strong> dem Durchlauf.<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">let</span> countdown = <span class="hljs-number">3</span>;
<span class="hljs-keyword">while</span> (countdown &gt; <span class="hljs-number">0</span>) { <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(countdown--); }
</code></pre>
</li>
<li><strong>Fußgesteuerte Schleife (<code>do...while</code>):</strong> Wird <strong>mindestens 1-mal</strong> ausgeführt (Prüfung danach).<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">let</span> eingabe;
<span class="hljs-keyword">do</span> { eingabe = <span class="hljs-string">&quot;ja&quot;</span>; } <span class="hljs-keyword">while</span> (eingabe !== <span class="hljs-string">&quot;ja&quot;</span>);
</code></pre>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="moderne-iteration-forof-vs-forin">Moderne Iteration: <code>for...of</code> vs. <code>for...in</code></h3>
<ul>
<li><strong><code>for...of</code> (Für Werte in Arrays / Iterables):</strong>
<ul>
<li>Iteriert direkt über die <strong>Elemente</strong> (sauber &amp; ohne Index-Stress).</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> staedte = [<span class="hljs-string">&quot;Würzburg&quot;</span>, <span class="hljs-string">&quot;Nürnberg&quot;</span>, <span class="hljs-string">&quot;München&quot;</span>];
<span class="hljs-keyword">for</span> (<span class="hljs-keyword">const</span> stadt <span class="hljs-keyword">of</span> staedte) {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(stadt); <span class="hljs-comment">// &quot;Würzburg&quot;, &quot;Nürnberg&quot;, ...</span>
}
</code></pre>
</li>
<li><strong><code>for...in</code> (Für Schlüssel / Objekteigenschaften):</strong>
<ul>
<li>Iteriert über die <strong>Keys</strong> eines Objekts.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> user = { <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Anna&quot;</span>, <span class="hljs-attr">rolle</span>: <span class="hljs-string">&quot;Admin&quot;</span> };
<span class="hljs-keyword">for</span> (<span class="hljs-keyword">const</span> key <span class="hljs-keyword">in</span> user) {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`<span class="hljs-subst">${key}</span>: <span class="hljs-subst">${user[key]}</span>`</span>); <span class="hljs-comment">// &quot;name: Anna&quot;, ...</span>
}
</code></pre>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<blockquote>
<p><strong>Faustregel:</strong> <em>for...of</em> für Arrays (Werte),<br />
<em>for...in</em> für Objekte (Keys)!</p>
</blockquote>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="schleifensteuerung-break--continue">Schleifensteuerung: <code>break</code> &amp; <code>continue</code></h3>
<p>Steuere den Ablauf innerhalb einer laufenden Schleife gezielt:</p>
<ul>
<li><strong><code>break</code> (Sofortiger Abbruch):</strong>
<ul>
<li>Beendet die Schleife komplett und springt dahinter.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">for</span> (<span class="hljs-keyword">let</span> i = <span class="hljs-number">1</span>; i &lt;= <span class="hljs-number">10</span>; i++) {
    <span class="hljs-keyword">if</span> (i === <span class="hljs-number">4</span>) <span class="hljs-keyword">break</span>; <span class="hljs-comment">// Stoppt die Schleife bei 4!</span>
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(i); <span class="hljs-comment">// Gibt 1, 2, 3 aus</span>
}
</code></pre>
</li>
<li><strong><code>continue</code> (Überspringen des aktuellen Durchlaufs):</strong>
<ul>
<li>Bricht nur den aktuellen Durchgang ab und springt zum nächsten.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">for</span> (<span class="hljs-keyword">let</span> i = <span class="hljs-number">1</span>; i &lt;= <span class="hljs-number">4</span>; i++) {
    <span class="hljs-keyword">if</span> (i === <span class="hljs-number">3</span>) <span class="hljs-keyword">continue</span>; <span class="hljs-comment">// Überspringt nur die 3!</span>
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(i); <span class="hljs-comment">// Gibt 1, 2, 4 aus</span>
}
</code></pre>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="%C3%BCbersicht--best-practices-der-iteration">Übersicht &amp; Best Practices der Iteration</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Schleife</th>
<th style="text-align:left">Liest...</th>
<th style="text-align:left">Haupt-Anwendungsfall</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong><code>for</code></strong></td>
<td style="text-align:left">Index (<code>i++</code>)</td>
<td style="text-align:left">Feste Anzahl / komplexe Zählschritte</td>
</tr>
<tr>
<td style="text-align:left"><strong><code>while</code></strong></td>
<td style="text-align:left">Bedingung (<code>true</code>)</td>
<td style="text-align:left">Warten auf Ereignis / dynamischer Zustand</td>
</tr>
<tr>
<td style="text-align:left"><strong><code>for...of</code></strong> <em>(Standard)</em></td>
<td style="text-align:left"><strong>Werte</strong></td>
<td style="text-align:left"><strong>Arrays &amp; Kollektionen</strong> durchlaufen</td>
</tr>
<tr>
<td style="text-align:left"><strong><code>for...in</code></strong></td>
<td style="text-align:left"><strong>Keys (Schlüssel)</strong></td>
<td style="text-align:left"><strong>Objekt-Eigenschaften</strong> inspizieren</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Best Practice:</strong> Nutze in modernem JavaScript für Arrays fast immer <em>for...of</em> – das vermeidet Typfehler und ist am lesbarsten.</p>
</blockquote>
