<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="function-declaration-vs-function-expression">Function Declaration vs. Function Expression</h3>
<ul>
<li><strong>Function Declaration (Klassische Funktion):</strong>
<ul>
<li>Wird per <em>Hoisting</em> an den Anfang des Scopes gezogen -&gt; vor ihrer Deklaration aufrufbar.</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"> <span class="hljs-keyword">function</span> <span class="hljs-title function_">gruss</span>(<span class="hljs-params">name</span>) {
     <span class="hljs-keyword">return</span> <span class="hljs-string">`Hallo <span class="hljs-subst">${name}</span>!`</span>;
 }
</code></pre>
<ul>
<li><strong>Function Expression (Funktionsausdruck):</strong>
<ul>
<li>Funktion wird in einer Variable gespeichert -&gt; erst <strong>ab der Zuweisung</strong> aufrufbar.</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript">  <span class="hljs-keyword">const</span> gruss = <span class="hljs-keyword">function</span>(<span class="hljs-params">name</span>) {
      <span class="hljs-keyword">return</span> <span class="hljs-string">`Hallo <span class="hljs-subst">${name}</span>!`</span>;
  };
</code></pre>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="55" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<blockquote>
<p><strong>Unterschied:</strong><br />
Declarations sind global/funktional verfügbar<br />
Expressions folgen den normalen Variablen-Regeln (<em>const</em>).</p>
</blockquote>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="56" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="modern--kompakt-arrow-functions">Modern &amp; Kompakt: Arrow Functions (<code>=&gt;</code>)</h3>
<p>Die prägnanteste Schreibweise für Funktionen in modernem JavaScript:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// Standard-Schreibweise:</span>
<span class="hljs-keyword">const</span> <span class="hljs-title function_">quadrat</span> = (<span class="hljs-params">x</span>) =&gt; { <span class="hljs-keyword">return</span> x * x; };

<span class="hljs-comment">// Kurzschreibweise (Impliziter Return bei Einzeilern):</span>
<span class="hljs-keyword">const</span> <span class="hljs-title function_">quadrat</span> = x =&gt; x * x;
</code></pre>
<ul>
<li><strong>Die 3 Kern-Merkmale von Arrow Functions:</strong>
<ol>
<li><strong>Kompakte Syntax:</strong> Kein <code>function</code>-Keyword erforderlich.</li>
<li><strong>Implizites <code>return</code>:</strong> Bei einzeiligen Ausdrücken ohne geschweifte Klammern <code>{}</code>.</li>
<li><strong>Lexikalisches <code>this</code>:</strong> Erbt das <code>this</code> aus dem umgebenden Kontext (ideal für Event-Handler).</li>
</ol>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="57" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="standard-parameter--rest-parameter-args">Standard-Parameter &amp; Rest-Parameter (<code>...args</code>)</h3>
<ul>
<li><strong>Standard-Parameter (Default Parameters):</strong>
<ul>
<li>Beugt <code>undefined</code>-Fehlern vor, indem Standardwerte hinterlegt werden.</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript">  <span class="hljs-keyword">function</span> <span class="hljs-title function_">erstelleUser</span>(<span class="hljs-params">name = <span class="hljs-string">&quot;Anonym&quot;</span>, rolle = <span class="hljs-string">&quot;Gast&quot;</span></span>) {
      <span class="hljs-keyword">return</span> <span class="hljs-string">`<span class="hljs-subst">${name}</span> (<span class="hljs-subst">${rolle}</span>)`</span>;
  }
</code></pre>
<ul>
<li><strong>Rest-Parameter (<code>...args</code> statt veraltetem <code>arguments</code>):</strong>
<ul>
<li>Bündelt beliebig viele Argumente in ein <strong>echtes Array</strong>.</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript">  <span class="hljs-keyword">function</span> <span class="hljs-title function_">summiere</span>(<span class="hljs-params">...zahlen</span>) {
      <span class="hljs-keyword">return</span> zahlen.<span class="hljs-title function_">reduce</span>(<span class="hljs-function">(<span class="hljs-params">summe, n</span>) =&gt;</span> summe + n, <span class="hljs-number">0</span>);
  }
  <span class="hljs-title function_">summiere</span>(<span class="hljs-number">5</span>, <span class="hljs-number">10</span>, <span class="hljs-number">15</span>); <span class="hljs-comment">// 30</span>
</code></pre>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="58" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="scope-lexical-environment--closures">Scope, Lexical Environment &amp; Closures</h3>
<ul>
<li><strong>Global Scope vs. Block Scope:</strong>
<ul>
<li><code>const</code> / <code>let</code> sind streng im umschließenden Block <code>{ ... }</code> geschützt.</li>
</ul>
</li>
<li><strong>Was ist eine Closure (Funktionsabschluss)?</strong>
<ul>
<li>Eine innere Funktion hat Zugriff auf Variablen ihres <strong>äußeren Entstehungs-Scopes</strong> – selbst nachdem die äußere Funktion beendet ist!</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">function</span> <span class="hljs-title function_">erstelleZaehler</span>(<span class="hljs-params"></span>) {
    <span class="hljs-keyword">let</span> count = <span class="hljs-number">0</span>; <span class="hljs-comment">// Kapselung im Scope der Closure</span>
    <span class="hljs-keyword">return</span> <span class="hljs-function">() =&gt;</span> ++count;
}

<span class="hljs-keyword">const</span> zaehler = <span class="hljs-title function_">erstelleZaehler</span>();
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-title function_">zaehler</span>()); <span class="hljs-comment">// 1</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-title function_">zaehler</span>()); <span class="hljs-comment">// 2</span>
</code></pre>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="59" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="vergleich--best-practices-f%C3%BCr-funktionen">Vergleich &amp; Best Practices für Funktionen</h3>
<table>
<thead>
<tr>
<th style="text-align:left">Merkmal</th>
<th style="text-align:left">Function Declaration</th>
<th style="text-align:left">Arrow Function (<code>=&gt;</code>)</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Syntax</strong></td>
<td style="text-align:left"><code>function name() {}</code></td>
<td style="text-align:left"><code>const name = () =&gt; {}</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Hoisting</strong></td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Ja (überall aufrufbar)</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Nein (erst nach Zeile verfügbar)</td>
</tr>
<tr>
<td style="text-align:left"><strong><code>this</code>-Bindung</strong></td>
<td style="text-align:left">Dynamisch (hängt vom Aufrufer ab)</td>
<td style="text-align:left">Lexikalisch (erbt vom Umfeld)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Impliziter Return</strong></td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Nein (benötigt <code>return</code>)</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Ja (bei Einzeiler ohne <code>{}</code>)</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Best Practice:</strong> Nutze <strong>Arrow Functions</strong> für Helper, Array-Methoden &amp; Event-Handler. Nutze <strong>Function Declarations</strong> für zentrale Skript-Funktionen.</p>
</blockquote>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="62" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="objekte--json-notation-schl%C3%BCssel-wert-speicher">Objekte &amp; JSON-Notation (Schlüssel-Wert-Speicher)</h3>
<ul>
<li><strong>Objekte in JavaScript:</strong>
<ul>
<li>Sammlungen von Eigenschaften (<em>Key-Value Pairs</em>).</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript">  <span class="hljs-keyword">const</span> user = { <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Anna&quot;</span>, <span class="hljs-attr">alter</span>: <span class="hljs-number">22</span>, <span class="hljs-attr">geovisStudent</span>: <span class="hljs-literal">true</span> };
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(user.<span class="hljs-property">name</span>);     <span class="hljs-comment">// Punkt-Notation: &quot;Anna&quot;</span>
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(user[<span class="hljs-string">&quot;alter&quot;</span>]); <span class="hljs-comment">// Klammer-Notation: 22</span>
</code></pre>
<ul>
<li><strong>JSON (JavaScript Object Notation):</strong>
<ul>
<li>Standardformat für den Datenaustausch im Web (Web-APIs &amp; Server).</li>
<li><strong><code>JSON.stringify(obj)</code></strong>: Wandelt ein JS-Objekt in einen JSON-String um.</li>
<li><strong><code>JSON.parse(jsonString)</code></strong>: Wandelt einen JSON-String zurück in ein JS-Objekt.</li>
</ul>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="63" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="moderne-objektorientierung-mit-class">Moderne Objektorientierung mit <code>class</code></h3>
<p>JS-Version ES6 führte die saubere <code>class</code>-Syntax ein (ersetzt alte Prototypen-Konstruktoren):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span> {
    #geheimnis = <span class="hljs-number">42</span>; <span class="hljs-comment">// Privates Feld (#) -&gt; von außen nicht direkt lesbar!</span>

    <span class="hljs-title function_">constructor</span>(<span class="hljs-params">name, rolle</span>) {
        <span class="hljs-variable language_">this</span>.<span class="hljs-property">name</span> = name;  <span class="hljs-comment">// Instanz-Variable</span>
        <span class="hljs-variable language_">this</span>.<span class="hljs-property">rolle</span> = rolle;
    }

    <span class="hljs-title function_">vorstellen</span>(<span class="hljs-params"></span>) { <span class="hljs-comment">// Methode</span>
        <span class="hljs-keyword">return</span> <span class="hljs-string">`Ich bin <span class="hljs-subst">${<span class="hljs-variable language_">this</span>.name}</span> (<span class="hljs-subst">${<span class="hljs-variable language_">this</span>.rolle}</span>).`</span>;
    }
}

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="vererbung-mit-extends-und-super">Vererbung mit <code>extends</code> und <code>super</code></h3>
<p>Klassen können Eigenschaften und Methoden von Elternklassen erben:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Student</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_ inherited__">Person</span> {
    <span class="hljs-title function_">constructor</span>(<span class="hljs-params">name, matrikelnummer</span>) {
        <span class="hljs-comment">// super() ruft den Konstruktor der Elternklasse (Person) auf:</span>
        <span class="hljs-variable language_">super</span>(name, <span class="hljs-string">&quot;Student&quot;</span>);
        <span class="hljs-variable language_">this</span>.<span class="hljs-property">matrikelnummer</span> = matrikelnummer;
    }

    <span class="hljs-title function_">lernen</span>(<span class="hljs-params"></span>) {
        <span class="hljs-keyword">return</span> <span class="hljs-string">`<span class="hljs-subst">${<span class="hljs-variable language_">this</span>.name}</span> (Matrikel: <span class="hljs-subst">${<span class="hljs-variable language_">this</span>.matrikelnummer}</span>) lernt JS.`</span>;
    }
}

<span class="hljs-keyword">const</span> s = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Student</span>(<span class="hljs-string">&quot;Lisa&quot;</span>, <span class="hljs-number">632217</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(s.<span class="hljs-title function_">vorstellen</span>()); <span class="hljs-comment">// Von Person geerbt!</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(s.<span class="hljs-title function_">lernen</span>());     <span class="hljs-comment">// Eigene Methode</span>
</code></pre>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="65" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="praxis-check-objekte--json-im-einsatz">Praxis-Check: Objekte &amp; JSON im Einsatz</h3>
<ul>
<li><strong>Ausführbare Demodatei:</strong> <code>Samples/JS/objects-json-demo.html</code></li>
<li><strong>Gezeigte Kernkonzepte im Code:</strong>
<ol>
<li><strong>JS-Objekt &amp; Zugriffe:</strong> Punkt-Notation (<code>student.name</code>) vs. Klammer-Notation (<code>student['id']</code>) &amp; verschachtelte Objekte.</li>
<li><strong><code>JSON.stringify(obj, null, 2)</code>:</strong> Wandelt ein JS-Objekt in ein lesbares JSON-String-Format um.</li>
<li><strong><code>JSON.parse(jsonText)</code>:</strong> Parst empfangenen JSON-Text vom Server zurück in ein echtes JS-Objekt für Berechnungen.</li>
<li><strong>Objekt-Methoden &amp; <code>this</code>:</strong> Funktions-Methoden innerhalb von Objekten mit Zugriff auf eigene Eigenschaften via <code>this</code>.</li>
</ol>
</li>
</ul>
<p><strong>Ausprobieren:</strong><br />
Öffne <code>Samples/JS/objects-json-demo.html</code> im Browser und teste die Live-Konsole!</p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="66" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="arrays-erstellen--grundlagen-array-literale">Arrays erstellen &amp; Grundlagen (Array-Literale <code>[]</code>)</h3>
<p>Arrays sind <strong>geordnete Listen</strong> von Elementen mit 0-basiertem Index:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// 1. Erstellung per Array-Literal [] (Best Practice!):</span>
<span class="hljs-keyword">const</span> staedte = [<span class="hljs-string">&quot;Würzburg&quot;</span>, <span class="hljs-string">&quot;Nürnberg&quot;</span>, <span class="hljs-string">&quot;München&quot;</span>];

<span class="hljs-comment">// 2. Zugriff über den 0-basierten Index &amp; Länge prüfen:</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(staedte[<span class="hljs-number">0</span>]);     <span class="hljs-comment">// &quot;Würzburg&quot; (Erstes Element)</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(staedte.<span class="hljs-property">length</span>);  <span class="hljs-comment">// 3 (Gesamtzahl der Elemente)</span>

<span class="hljs-comment">// 3. Element am Index verändern:</span>
staedte[<span class="hljs-number">1</span>] = <span class="hljs-string">&quot;Bamberg&quot;</span>;      <span class="hljs-comment">// Ersetzt &quot;Nürnberg&quot;</span>
</code></pre>
<ul>
<li><strong>Eigenschaft:</strong> Arrays können beliebige Datentypen mischen (Strings, Zahlen, Objekte).</li>
<li><strong>Merksatz:</strong> Nutze immer <code>[]</code> statt <code>new Array()</code>.</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="67" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="moderne-array-methoden-funktionaler-stil">Moderne Array-Methoden (Funktionaler Stil)</h3>
<p>Methoden zur sauberen Datenverarbeitung ohne manuelle <code>for</code>-Schleifen:</p>
<ul>
<li><strong><code>map()</code> (Transformieren):</strong> Wandelt jedes Element um.
<ul>
<li><code>[1, 2, 3].map(x =&gt; x * 2)</code> ➔ <code>[2, 4, 6]</code></li>
</ul>
</li>
<li><strong><code>filter()</code> (Filtern):</strong> Behält nur Elemente, die die Bedingung erfüllen.
<ul>
<li><code>[10, 5, 20].filter(x =&gt; x &gt;= 10)</code> ➔ <code>[10, 20]</code></li>
</ul>
</li>
<li><strong><code>reduce()</code> (Aggregieren):</strong> Berechnet einen einzelnen Gesamtwert.
<ul>
<li><code>[10, 20, 30].reduce((sum, n) =&gt; sum + n, 0)</code> ➔ <code>60</code></li>
</ul>
</li>
<li><strong><code>find()</code> &amp; <code>includes()</code>:</strong> Sucht Ersttreffer (<code>find</code>) oder prüft Existenz (<code>includes</code>).</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="68" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="destructuring-assignment-werte-entpacken">Destructuring Assignment (Werte entpacken)</h3>
<p>Kompaktes Extrahieren von Werten aus Objekten und Arrays in eigene Variablen:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// 1. Objekt-Destructuring:</span>
<span class="hljs-keyword">const</span> user = { <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Sarah&quot;</span>, <span class="hljs-attr">stadt</span>: <span class="hljs-string">&quot;Würzburg&quot;</span>, <span class="hljs-attr">alter</span>: <span class="hljs-number">24</span> };
<span class="hljs-keyword">const</span> { name, stadt } = user; <span class="hljs-comment">// Erzeugt Variablen &#x27;name&#x27; und &#x27;stadt&#x27;</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`<span class="hljs-subst">${name}</span> aus <span class="hljs-subst">${stadt}</span>`</span>); <span class="hljs-comment">// &quot;Sarah aus Würzburg&quot;</span>

<span class="hljs-comment">// 2. Array-Destructuring:</span>
<span class="hljs-keyword">const</span> koordinaten = [<span class="hljs-number">49.79</span>, <span class="hljs-number">9.93</span>];
<span class="hljs-keyword">const</span> [lat, lng] = koordinaten; <span class="hljs-comment">// lat = 49.79, lng = 9.93</span>
</code></pre>
<blockquote>
<p><strong>Vorteil:</strong> Erspart unübersichtliches <code>const name = user.name; const stadt = user.stadt;</code>.</p>
</blockquote>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="69" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="der-spread-operator">Der Spread-Operator (<code>...</code>)</h3>
<p>Vervielfältigt oder kombiniert Arrays und Objekte in einer neuen Struktur:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// 1. Arrays zusammenfügen / klonen:</span>
<span class="hljs-keyword">const</span> primaer = [<span class="hljs-string">&quot;Rot&quot;</span>, <span class="hljs-string">&quot;Blau&quot;</span>];
<span class="hljs-keyword">const</span> alleFarben = [...primaer, <span class="hljs-string">&quot;Grün&quot;</span>, <span class="hljs-string">&quot;Gelb&quot;</span>]; <span class="hljs-comment">// [&quot;Rot&quot;, &quot;Blau&quot;, &quot;Grün&quot;, &quot;Gelb&quot;]</span>

<span class="hljs-comment">// 2. Objekte erweitern / unveränderlich anpassen (Immutable Update):</span>
<span class="hljs-keyword">const</span> basisConfig = { <span class="hljs-attr">theme</span>: <span class="hljs-string">&quot;dark&quot;</span>, <span class="hljs-attr">fontSize</span>: <span class="hljs-number">16</span> };
<span class="hljs-keyword">const</span> userConfig = { ...basisConfig, <span class="hljs-attr">fontSize</span>: <span class="hljs-number">18</span>, <span class="hljs-attr">sidebar</span>: <span class="hljs-literal">true</span> };
</code></pre>
<blockquote>
<p><strong>Unterschied:</strong> <strong>Spread (<code>...</code>)</strong> entpackt Elemente; <strong>Rest (<code>...</code>)</strong> packt Elemente in ein Array zusammen!</p>
</blockquote>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="70" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="71">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="praxis-check-arrays--moderne-methoden-im-einsatz">Praxis-Check: Arrays &amp; Moderne Methoden im Einsatz</h3>
<ul>
<li><strong>Ausführbare Demodatei:</strong> <code>Samples/JS/arrays-demo.html</code></li>
<li><strong>Gezeigte Kernkonzepte im Code:</strong>
<ol>
<li><strong>Grundlagen (Array-Literale <code>[]</code>):</strong> Erstellung, 0-basierter Indexzugriff (<code>staedte[0]</code>) &amp; <code>.length</code>-Eigenschaft.</li>
<li><strong><code>map()</code> (Transformieren):</strong> Erzeugt neues Array mit berechneten Bruttopreisen (<code>netto * 1.19</code>).</li>
<li><strong><code>filter()</code> (Filtern):</strong> Selektiert eine Untermenge von Objekten auf Basis von Bedingungen (<code>nettoPreis &lt; 50</code>).</li>
<li><strong><code>reduce()</code> (Aggregieren):</strong> Summiert den gesamten Datenbestand schrittweise auf 1 Gesamtwert herunter.</li>
</ol>
</li>
</ul>
<p><strong>Ausprobieren:</strong><br />
Öffne <code>Samples/JS/arrays-demo.html</code> im Browser und teste die interaktiven Buttons!</p>
