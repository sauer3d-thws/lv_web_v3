<h3 id="warum-gerade-am-cern">Warum gerade am CERN?</h3>
<ul>
<li><strong>Riesige Datenmengen &amp; Forscher-Netzwerke:</strong><br />
Tausende Wissenschaftler weltweit arbeiteten an gemeinsamen physikalischen Projekten.</li>
<li><strong>Inkompatible Computersysteme:</strong><br />
Forscher nutzten unterschiedlichste Hardware &amp; Software; der Dokumentenaustausch war extrem mühsam.</li>
<li><strong>Fehlende Verknüpfung:</strong> Es gab keine Methode,<br />
um Informationen auf verschiedenen Servern direkt miteinander in Beziehung zu setzen.<br />
</li>
</ul>

<li>sie kennzeichnen die logische Bedeutung des Textes.</li>

<ul>
<li>Zustandsloses Protokoll zur Übertragung von Daten (HTML, CSS, JS, Bilder, Videos) im Web.</li>
<li>Regelt die Kommunikation zwischen Webbrowser (Client) und Webserver.</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Client-Server-Modell:</strong></p>
<ul>
<li>Request (Anfrage): Client fordert eine Ressource an (z. B. beim Klick auf einen Link).</li>
<li>Response (Antwort): Server liefert die Ressource zurück (z. B. die HTML-Datei).</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Zustandslosigkeit (Stateless):</strong></p>
<ul>
<li>Jede Anfrage wird völlig unabhängig von vorherigen Anfragen behandelt.</li>
<li>Der Server speichert standardmäßig keine Verbindungsinformationen (daher werden Cookies oder Sessions für Logins/Warenkörbe benötigt).</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>

<th>Bedeutung</th>
</tr>
</thead>

<tr>

<td>OK</td>

<td>Umleitung auf eine andere URL.</td>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Verschlüsselung zwischen Webserver und Browser</strong></p>
<ul>
<li>https-Verfahren wird von allen Browsern unterstützt</li>
<li>https ist eine Sicherheits-Technologie die nicht installiert werden muss</li>
<li>sofort ersichtlich</li>
<li>einfach zu überwachen</li>
</ul>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<blockquote>
<p>Eine HTTPS-Seite erkennen Sie daran, dass einerseits oben in der Adresszeile des Browsers der besagte Schriftzug steht, andererseits an dem verriegelten Schloss .<br />
</p>
</blockquote>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="33" style="" data-marpit-pagination-total="175" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>SSL - Secure Sockets Layer</strong></p>
<ul>
<li>SSL ist die Verschlüsselungstechnologie,<br />
die für HTTPS verwendet wird.</li>
<li>Es stellt sicher, dass die Daten, die zwischen<br />
Client und Server übertragen werden,<br />
vertraulich und unverfälscht bleiben.</li>
<li>SSL/TLS-Zertifikate werden von<br />
Zertifizierungsstellen ausgestellt,<br />
um die Identität einer Website zu verifizieren.</li>
</ul>
<p><a href="https://wiki.selfhtml.org/wiki/Grundlagen/HTTPS_und_TLS">https://wiki.selfhtml.org/wiki/Grundlagen/HTTPS_und_TLS</a></p>

<p><strong>digitales Zertifikat</strong></p>
<ul>
<li>ist ein digitaler Datensatz</li>
<li>nach Standards der ITU-T oder der IETF</li>
<li>bestätigt bestimmte Eigenschaften von Personen oder Objekten</li>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<blockquote>
<p>Wer verlängert das Zertifikat?</p>
</blockquote>
<p>Technisch wird ein Zertifikat nicht verlängert, sondern <strong>durch ein neues ersetzt</strong>.</p>
<ul>
<li><strong>Certification Authority (CA):</strong> Stellt das neue Zertifikat aus (z. B. Let's Encrypt).</li>
<li><strong>Webhoster:</strong> Übernimmt bei Standard-Webspaces die Erneuerung meist vollautomatisch.</li>
<li><strong>Server-Administratoren:</strong> Nutzen Bots (z. B. <em>Certbot</em> über das ACME-Protokoll), um Zertifikate auf eigenen Servern automatisch alle 60 bis 90 Tage zu erneuern.</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="webspace">Webspace</h3>
<blockquote>
<p>beschreibt den Speicherplatz auf einem Server, der zur Unterbringung von Dateien einer Website genutzt wird.</p>
</blockquote>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<ul>
<li><strong>Speicherplatz</strong> für Dateien auf einem (Web)Server</li>
<li>Ist über das Internet <strong>dauerhaft verbunden</strong></li>
<li>Online-Speicherplatz wird häufig von <strong>Internetdienstanbietern</strong> bereitgestellt</li>
<li>Kunden stellen Dokumente und Datenbestände (wie Musikdateien), Websites etc zur Veröffentlichung online</li>
<li>Das Bereitstellen von Speicherplatz im Internet wird <strong>Webhosting</strong> oder auch <strong>Nethosting</strong> genannt</li>
<li>Die Webserver großer Anbieter stehen in  <strong>Rechenzentren</strong>, in denen hunderte von Webservern Mailservern und Diensteanbietern ihre Dienste verrichten.</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<blockquote>
<p>HTTPS funktioniert nur dann optimal, wenn alle Inhalte, die auf einer Webseite dargestellt werden, über HTTPS geladen werden.</p>
</blockquote>
<p>Werden zum Beispiel auf einer HTTPS-Seite externe Ressourcen wie Bilder, Skripte oder CSS-Dateien unverschlüsselt nachgeladen, spricht man von einem sogenannten Mixed-Content, der zu Problemen bei der sicheren Darstellung führen kann.</p>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<h3 id="domain--dns-grundlagen">Domain &amp; DNS: Grundlagen</h3>
<ul>
<li><strong>Definition:</strong> Eine Domain (dt. <em>Domäne/Bereich</em>) ist ein weltweit eindeutiger Name im hierarchischen <strong>Domain Name System (DNS)</strong>.</li>
<li><strong>Zweck:</strong> Übersetzung von IP-Adressen (z. B. <code>193.175.120.40</code>) in menschenlesbare Namen (z. B. <code>www.thws.de</code>).</li>
</ul>
<p><img src="../img/domain-hierarchy.jpg" alt="domain-hierarchy" /></p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<ul>
<li><strong>Webspace-Erreichbarkeit:</strong> Um eine Webseite online zu stellen, werden deren Daten auf einen Webspace geladen. Der Webserver macht diese unter der zugeordneten Domain erreichbar.</li>
<li><strong>Hierarchischer DNS-Aufbau:</strong>
<ul>
<li><strong>Root-Label (Wurzel):</strong> Angedeutet durch den letzten Punkt (z. B. <code>www.thws.de.</code>).</li>
<li><strong>Top-Level-Domain (TLD):</strong> <code>.de</code> (länderspezifisch/ccTLD) oder <code>.org</code> (allgemein/gTLD).</li>
<li><strong>Second-Level-Domain:</strong> Der eigentliche Name (z. B. <code>thws</code>).</li>
</ul>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="subdomains--technische-limits">Subdomains &amp; Technische Limits</h3>
<ul>
<li><strong>Subdomains:</strong> Einer Domain können beliebig viele weitere Subdomains vorangestellt werden<br />
(z. B. <code>elearning.thws.de</code>), abgetrennt durch einen Punkt.</li>
<li><strong>Längenbeschränkungen (gemäß RFC 1035):</strong>
<ul>
<li><strong>Pro Label</strong> (Abschnitt zwischen zwei Punkten): <strong>Maximal 63 Zeichen</strong>.</li>
<li><strong>Gesamt-FQDN</strong> (Fully Qualified Domain Name): <strong>Maximal 253 Zeichen</strong><br />
in Textdarstellung (bzw. 255 Byte im DNS-Format).</li>
</ul>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-class="img-right" data-theme="thws-sts" lang="en-US" class="img-right" data-marpit-pagination="48" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--class:img-right;--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<ul>
<li><strong>Adressierung:</strong> Mit einem FQDN kann jedes physische oder virtuelle Objekt im Netz eindeutig adressiert werden.</li>
<li><strong>Nameserver:</strong> Speichern DNS-Einträge (z. B. A-Record für IPv4) und verbinden den Domain-Namen mit der IP-Adresse des Servers.</li>
</ul>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<h3 id="vergabestellen--denic">Vergabestellen &amp; DENIC</h3>
<p><strong><a href="https://www.denic.de/">https://www.denic.de/</a></strong></p>
<ul>
<li><strong>Registrar / NIC (Network Information Center):</strong> Top-Level-Domain wird von Vergabestelle verwaltet: exakte Namensregeln:</li>
<li><strong>DENIC eG (Frankfurt am Main):</strong>
<ul>
<li>Zentrale Genossenschaft &amp; Registrierungs-<br />
stelle für alle <code>.de</code>-Domains.</li>
<li>Verwaltet über 17 Millionen Domains (gehört weltweit zu den größten Länder-TLDs).</li>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<h3 id="der-%E2%80%9Esprechende-domain-name">Der „sprechende“ Domain-Name</h3>
<ul>
<li><strong>Definition:</strong> Domain-Name verrät beim Lesen Inhalt / Zweck/ Anbieter</li>
<li><strong>Suchmaschinen-Relevanz (SEO):</strong>
<ul>
<li>Suchmaschinen analysieren als Erstes Domain-Namen.</li>
<li>Ein sprechender Name fungiert als<br />
direkter Ranking-Faktor und erhöht Klickrate (CTR).</li>
</ul>
</li>
<li><strong>Vorteil:</strong> Nutzer verstehen sofort, worum es geht – das schafft Vertrauen und stärkt die Barrierefreiheit/Verständlichkeit.</li>
</ul>
<p><img src="../img/domain-seo.png" alt="domain-seo" /></p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-class="img-right" data-theme="thws-sts" lang="en-US" class="img-right" data-marpit-pagination="55" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--class:img-right;--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<h3 id="kriterien-zur-auswahl-des-domain-namens">Kriterien zur Auswahl des Domain-Namens</h3>
<ul>
<li><strong>Persönliche Marke (Identität):</strong>
<ul>
<li>Steht eine Person oder ein persönlicher Service im Vordergrund?</li>
<li><em>Tipp:</em> Den eigenen Namen integrieren (z. B. <code>maik-caravan.de</code>).</li>
</ul>
</li>
<li><strong>Lokaler Bezug (Geographie):</strong>
<ul>
<li>Wird ein Service in einer bestimmten Stadt/Region angeboten?</li>
<li><em>Tipp:</em> Ortsnamen einbauen (z. B. <code>autoinstandsetzung-wuerzburg.de</code>).</li>
</ul>
</li>
<li><strong>Nischen- / Kerntätigkeit (Dienstleistung):</strong>
<ul>
<li>Bieten Sie eine außergewöhnliche oder sehr spezifische Leistung an?</li>
<li><em>Tipp:</em> Kern-Keywords verwenden (z. B. <code>autarker-fahrzeugausbau.de</code>).</li>
</ul>
</li>
</ul>
<p><img src="../img/domain-criteria.png" alt="domain-criteria" /></p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-class="img-right" data-theme="thws-sts" lang="en-US" class="img-right" data-marpit-pagination="56" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--class:img-right;--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<h3 id="best-practices--fallstricke">Best Practices &amp; Fallstricke</h3>
<ul>
<li><strong>Kurz &amp; Einprägsam:</strong> So kurz wie möglich, leicht zu schreiben und sich zu merken.</li>
<li><strong>Bindestriche sinnvoll nutzen:</strong>
<ul>
<li>Verbessert die Lesbarkeit(z. B. <code>maiks-mobiler-service.de</code> statt <code>maiksmobilerservice.de</code>).</li>
<li>Vermeidet Zweideutigkeiten.</li>
</ul>
</li>
<li><strong>Rechtliche Absicherung:</strong>
<ul>
<li>Vor Registrierung prüfen: Keine Markenrechte / Firmennamen / geschützte Begriffe</li>
</ul>
</li>
</ul>
<p><img src="../img/domain-checklist.png" alt="domain-checklist" /></p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="57" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<blockquote>
<p>Die richtige TLD:<br />
Für den deutschen Markt immer primär <code>.de</code> wählen.</p>
</blockquote>
<p>Aber auch spezifische Domains sind möglich:<br />
<strong><code>.ai</code></strong> ist die TLD für &quot;Caribbean island of Anguilla&quot;<br />
:)</p>
<p><strong><code>.edu</code></strong> Domain ist streng limitiert und steht offiziell fast ausschließlich US-amerikanischen, staatlich akkreditierten Bildungseinrichtungen zur Verfügung. Internationale oder private Institutionen können diese meist nicht registrieren.</p>
<p><strong><code>.com</code></strong> ist die TLD für kommerzielle Unternehmen und Organisationen weltweit &amp; wirkt professionell.</p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-class="img-right" data-theme="thws-sts" lang="en-US" class="img-right" data-marpit-pagination="58" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--class:img-right;--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<h3 id="ftp-grundlagen--dateitransfer">FTP: Grundlagen &amp; Dateitransfer</h3>
<ul>
<li><strong>Definition:</strong> Das <strong>File Transfer Protocol (FTP)</strong> Netzwerkprotokoll zur Übertragung von Dateien über IP-Netzwerke.</li>
<li><strong>Zustandsbehaftet:</strong> Der Server speichert während einer Sitzung den Zustand (z. B. das aktuelle Arbeitsverzeichnis).</li>
<li><strong>Funktionen:</strong> Upload (Client → Server), Download (Server → Client), Datei- &amp; Verzeichnisverwaltung (Erstellen, Löschen, Umbenennen).</li>
</ul>
<p><img src="../img/ftp-basics.png" alt="ftp-basics" /></p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="59" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="ftp-verbindungsaufbau-aktiv-vs-passiv">FTP-Verbindungsaufbau: Aktiv vs. Passiv</h3>
<ul>
<li><strong>Zwei getrennte Kanäle:</strong>
<ul>
<li><strong>Steuerkanal (Control Port 21):</strong> Client initiiert TCP-Verbindung für Befehle &amp; Statuscodes.</li>
<li><strong>Datenkanal:</strong> Übertragung der eigentlichen Dateiinhalte.</li>
</ul>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-class="img-right" data-theme="thws-sts" lang="en-US" class="img-right" data-marpit-pagination="60" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--class:img-right;--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<ul>
<li><strong>Aktives FTP (PORT):</strong>
<ul>
<li>Server initiiert die Datenverbindung aktiv zum Client (Port 20 → Client).</li>
<li><em>Problem:</em> Client-Firewalls/NAT blockieren oft den eingehenden Zugriff vom Server.</li>
</ul>
</li>
<li><strong>Passives FTP (PASV):</strong>
<ul>
<li>Client initiiert die Datenverbindung zu<br />
einem vom Server vorgegebenen Port.</li>
<li><em>Standard im Webhosting,</em> da firewallsicher für den Client.</li>
</ul>
</li>
</ul>
<p><img src="../img/ftp-modes.jpg" alt="ftp-modes" /></p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-class="img-right" data-theme="thws-sts" lang="en-US" class="img-right" data-marpit-pagination="61" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--class:img-right;--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<h3 id="ftp-sicherheit--ftp-clients">FTP-Sicherheit &amp; FTP-Clients</h3>
<ul>
<li><strong>Das Sicherheitsrisiko:</strong> Klassisches FTP überträgt Zugangsdaten (Benutzer/Passwort) und Dateien <strong>unverschlüsselt</strong> im Klartext.</li>
<li><strong>Sichere Alternativen (Standard heute):</strong>
<ul>
<li><strong>SFTP (SSH File Transfer Protocol):</strong> verschlüsselte Übertragung über SSH (Port 22).</li>
<li><strong>FTPS (FTP over SSL/TLS):</strong> Verschlüsseltes FTP (Port 21 mit Explicit TLS oder Port 990).</li>
</ul>
</li>
</ul>
<p><img src="../img/ftp-security.png" alt="ftp-security" /></p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-class="img-right" data-theme="thws-sts" lang="en-US" class="img-right" data-marpit-pagination="62" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--class:img-right;--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<ul>
<li><strong>FTP-Clients:</strong> Spezialisierte Software wie <strong>FileZilla</strong> (Open Source, plattformunabhängig) ermöglicht einfache Übertragung per Drag-and-Drop.</li>
</ul>

<h3 id="xampp-lokale-testumgebung">XAMPP: Lokale Testumgebung</h3>
<ul>
<li><strong>Was ist XAMPP?</strong> Ein kostenloses Softwarepaket zur lokalen Simulation eines Webservers.</li>
<li><strong>Namensbedeutung:</strong> <strong>X</strong> (plattformübergreifend), <strong>A</strong> (Apache Webserver), <strong>M</strong> (MariaDB/MySQL Datenbank), <strong>P</strong> (PHP Skriptsprache), <strong>P</strong> (Perl).</li>
</ul>
<p><img src="../img/xampp.jpg" alt="xampp" /></p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-class="img-right" data-theme="thws-sts" lang="en-US" class="img-right" data-marpit-pagination="65" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--class:img-right;--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<ul>
<li><strong>Installationstipps für Einsteiger:</strong>
<ul>
<li><strong>WICHTIG:</strong> Unter Windows <em>nicht</em> in <code>C:\Program Files</code> installieren, sondern direkt in <code>C:\xampp\</code> ablegen (verhindert Rechteprobleme / UAC-Fehler).</li>
<li>Setup-Auswahl: Für unsere Zwecke reichen Apache, MySQL und PHP vollkommen aus.</li>
</ul>
</li>
</ul>
<p><img src="../img/xampp-install.png" alt="xampp-install" /></p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<h3 id="bedienung--portkonflikte">Bedienung &amp; Portkonflikte</h3>
<ul>
<li><strong>Starten der Dienste:</strong> Das <em>XAMPP Control Panel</em> öffnen und bei <strong>Apache</strong> und <strong>MySQL</strong> auf <em>Start</em> klicken (Status leuchtet grün).</li>
<li><strong>Standard-Ports:</strong> Apache belegt standardmäßig Port <strong>80</strong> (HTTP) und <strong>443</strong> (HTTPS).</li>
</ul>
<p><img src="../img/xampp-control.png" alt="xampp-control" /></p>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<h3 id="webseiten-ablegen--lokal-testen">Webseiten ablegen &amp; lokal testen</h3>
<ul>
<li><strong>Der htdocs-Ordner:</strong> Der zentrale Speicherort für alle eigenen Webdateien (<code>.html</code>, <code>.css</code>, <code>.js</code>) liegt unter <code>C:\xampp\htdocs\</code>.</li>
<li><strong>Projekt-Struktur:</strong>
<ul>
<li>Erstelle dort einen eigenen Ordner für dein Projekt (z. B. <code>htdocs\mein-projekt\</code>).</li>
</ul>
</li>
</ul>
<p><img src="../img/xampp-htdocs.png" alt="xampp-htdocs" /></p>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<h3 id="aufruf-im-browser">Aufruf im Browser</h3>
<ul>
<li><strong>Startseite der Testumgebung:</strong>
<ul>
<li><code>http://localhost/</code> oder <code>http://127.0.0.1/</code> eingeben.</li>
<li>Leitet automatisch auf die XAMPP-Dashboard-Startseite weiter.</li>
</ul>
</li>
<li><strong>Dein Projekt aufrufen:</strong>
<ul>
<li>Adresse zusammensetzen aus localhost + Projektverzeichnis + Datei:</li>
<li><code>http://localhost/mein-projekt/index.html</code></li>
</ul>
</li>
</ul>
<p><img src="../img/xampp-localhost.png" alt="xampp-localhost" /></p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="70" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="was-ist-%E2%80%9Elocalhost">Was ist „localhost“?</h3>
<ul>
<li><strong>Bedeutung:</strong> Der Standard-Hostname für den eigenen, lokalen Computer (auch <em>Loopback-Adresse</em> genannt).</li>
<li><strong>IP-Adresse:</strong> Löst standardmäßig auf die IP-Adresse <code>127.0.0.1</code> (IPv4) bzw. <code>::1</code> (IPv6) auf.</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="71" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<ul>
<li><strong>Funktionsweise:</strong> Alle Anfragen an <code>localhost</code> verlassen den Rechner nicht, sondern werden<br />
netzwerkintern direkt an das eigene System zurückgeschleift.</li>
<li><strong>Zweck beim Webdesign:</strong>
<ul>
<li>Testen von Webseiten auf dem eigenen Server (z. B. Apache unter XAMPP), ohne dass eine Internetverbindung benötigt wird.</li>
<li>Schutz der Entwicklungsumgebung vor unbefugtem Zugriff von außen.</li>
</ul>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="72" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="mongoose-die-xampp-alternative">Mongoose: Die XAMPP-Alternative</h3>
<p><a href="https://mongoose.ws/binary/">https://mongoose.ws/binary/</a></p>
<ul>
<li><strong>Was ist Mongoose?</strong> Ein extrem leichtgewichtiger Webserver für statische Webseiten.</li>
<li><strong>Vorteil:</strong> Keine Installation nötig! Er besteht aus einer einzigen Datei (<code>mongoose.exe</code>).</li>
<li><strong>Ideal für Einsteiger:</strong> Wenn du nur HTML, CSS und JavaScript testen willst (kein PHP oder MySQL), ist Mongoose viel einfacher als das mächtige XAMPP.</li>
<li><strong>So einfach geht's:</strong>
<ol>
<li><code>mongoose.exe</code> herunterladen.</li>
<li>Direkt in deinen Projektordner (neben die <code>index.html</code>) kopieren.</li>
<li>Per Doppelklick starten.</li>
<li>Webadresse <code>http://localhost:8080</code> im Browser aufrufen.</li>
</ol>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="73" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="mongoose-praxis-tipps--gefahren">Mongoose: Praxis-Tipps &amp; Gefahren</h3>
<ul>
<li><strong>Wo läuft der Server?</strong> Nach dem Start öffnet sich kein großes Fenster. Mongoose nistet sich lautlos im <strong>Infobereich (System Tray)</strong> unten rechts neben der Uhr ein (rotes Symbol).</li>
<li><strong>Beenden:</strong> Rechtsklick auf das rote Mongoose-Symbol im Infobereich -&gt; <em>Exit</em>.</li>
<li><strong><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> ACHTUNG: Mehrfachausführung vermeiden!</strong>
<ul>
<li>Klicke die <code>mongoose.exe</code> nur <strong>einmal</strong> an. Startest du sie mehrfach (z. B. aus zwei Projektordnern), schlägt die Portbindung fehl.</li>
</ul>
</li>
<li><strong><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> ACHTUNG: Parallelbetrieb blockiert Ports!</strong>
<ul>
<li>Jeder Port (standardmäßig <code>8080</code>) kann nur von <strong>einem</strong> Programm belegt werden.</li>
<li>Läuft bereits XAMPP (Apache) oder ein anderes Mongoose auf demselben Port, kommt es zu Konflikten. Beende immer den alten Server, bevor du einen neuen startest!</li>
</ul>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-class="structural" data-theme="thws-sts" lang="en-US" class="structural" data-marpit-pagination="74" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--class:structural;--theme:thws-sts;" data-marpit-pagination-total="175">

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<h3 id="webseiten-sind-kein-starres-pdf">Webseiten sind kein starres PDF!</h3>
<ul>
<li><strong>Das fluide Web:</strong> html ist flexibel!</li>
<li><strong>Einflussfaktoren:</strong> Display-Größe (Mobil bis Desktop), Betriebssystem, Auflösung, installierte Schriften, Benutzereinstellungen.</li>
<li><strong>Paradigmenwechsel beim Design:</strong>
<ul>
<li><em>Früher:</em> Der starre Versuch, Webseiten überall exakt identisch aussehen zu lassen („Pixel-Perfect“).</li>
<li><em>Heute:</em> <strong>Responsive &amp; Adaptive Webdesign</strong> (Layouts fließen und passen sich dynamisch an).</li>
</ul>
</li>
</ul>
<p><img src="../img/fluid-layout.png" alt="fluid-layout" /></p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="wann-ist-ein-layout-%E2%80%9Ekorrekt">Wann ist ein Layout „korrekt“?</h3>
<br />
<blockquote>
<p>Darstellungsunterschiede zwischen Browsern sind normal – solange die <strong>Funktionalität &amp; Usability</strong> gewährleistet bleibt!</p>
</blockquote>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<p><strong>Die 4 goldenen Regeln der Usability:</strong></p>
<ol>
<li><strong>Lesbarkeit:</strong> Alle Texte müssen<br />
ungehindert lesbar sein.</li>
<li><strong>Navigation:</strong> Bedienelemente müssen auffindbar sein &amp; wie erwartet reagieren.</li>
<li><strong>Interaktivität:</strong> Formulare müssen sich problemlos ausfüllen &amp; absenden lassen.</li>
<li><strong>Logik:</strong> JavaScript-Funktionen müssen fehlerfrei laufen &amp; das richtige Ergebnis liefern.</li>
</ol>
<p><img src="../img/rendering-checklist.png" alt="rendering-checklist" /></p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="84" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Praxistipps für Webentwickler</strong></p>
<ul>
<li><strong>Cross-Browser-Testing:</strong> Teste deine Webseiten immer auf mindestens drei unterschiedlichen Rendering-Engines (Blink, WebKit, Gecko).</li>
<li><strong>Kompatibilität prüfen:</strong> Nutze <a href="https://caniuse.com/">Can I use...</a> vor dem Einsatz neuer CSS-/JS-Features.</li>
<li><strong>DevTools gezielt einsetzen (F12):</strong>
<ul>
<li>Firefox für Layout-Debugging (Grid/Flexbox).</li>
<li>Chrome für Performance- und JavaScript-Analysen.</li>
</ul>
</li>
<li><strong>Quelle:</strong> <a href="https://developer.mozilla.org/">MDN Web Docs</a></li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="85" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="der-browser-cache-in-der-webentwicklung">Der Browser-Cache in der Webentwicklung</h3>
<ul>
<li><strong>Definition:</strong> Lokaler Pufferspeicher des Webbrowsers, der bereits heruntergeladene Ressourcen (Bilder, CSS, JS, HTML) auf dem Rechner des Nutzers zwischenspeichert.</li>
<li><strong>Vorteile:</strong>
<ul>
<li><strong>Page Speed:</strong> Beschleunigt das Laden von Folgeseiten erheblich.</li>
<li><strong>Netzwerkschonung:</strong> Reduziert den Datenverkehr und entlastet den Webserver.</li>
</ul>
</li>
<li><strong>Das Entwickler-Problem:</strong>
<ul>
<li>Änderungen an CSS- oder JS-Dateien werden beim einfachen Neuladen oft nicht angezeigt, weil der Browser die veraltete Version aus dem Cache lädt.</li>
</ul>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-class="img-right" data-theme="thws-sts" lang="en-US" class="img-right" data-marpit-pagination="86" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--class:img-right;--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<h3 id="entwicklertools-werkzeuge-f%C3%BCr-profis">Entwicklertools: Werkzeuge für Profis</h3>
<ul>
<li><strong>Definition:</strong> Die Entwicklertools (oft <em>DevTools</em> oder <em>F12-Tools</em>) sind ein mächtiges, integriertes Werkzeugset in jedem modernen Browser.</li>
<li><strong>Bedeutung:</strong> Das wichtigste Instrument für Webentwickler, um Webseiten live zu analysieren, Fehler zu beheben und Performance zu optimieren.</li>
<li><strong>Aufruf:</strong> Taste <code>F12</code> oder <code>Strg + Umschalt + I</code> (Windows) bzw. <code>Cmd + Opt + I</code> (macOS).</li>
</ul>
<p><img src="../img/devtools.jpg" alt="devtools" /></p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="87" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-class="img-right" data-theme="thws-sts" lang="en-US" class="img-right" data-marpit-pagination="87" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--class:img-right;--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<h3 id="was-du-mit-den-devtools-machen-kannst">Was du mit den DevTools machen kannst:</h3>
<ul>
<li><strong>HTML &amp; CSS inspizieren:</strong> Live-Änderungen am Layout vornehmen und sofort sehen, wie sich das Design verändert.</li>
<li><strong>Performance messen:</strong> Ladezeiten analysieren und Optimierungspotenziale identifizieren.</li>
<li><strong>Netzwerkverkehr beobachten:</strong> Alle Anfragen an den Server verfolgen und prüfen, ob alle Ressourcen korrekt geladen werden.</li>
<li><strong>JavaScript-Code debuggen:</strong> Fehler im Skript finden und die Ausführung schrittweise nachvollziehen.</li>
<li><strong>Mobile Ansichten simulieren:</strong> Testen, wie die Webseite auf unterschiedlichen Gerätegrößen und Auflösungen aussieht.</li>
</ul>
<p><img src="../img/devtools.jpg" alt="devtools" /></p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-class="img-right" data-theme="thws-sts" lang="en-US" class="img-right" data-marpit-pagination="88" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--class:img-right;--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<h3 id="1-elemente-elements">1. Elemente (Elements)</h3>
<ul>
<li><strong>Das DOM inspizieren:</strong> Zeigt den aktuellen Zustand des <strong>DOM (Document Object Model)</strong> an – also die Live-Baumstruktur aller HTML-Elemente.</li>
<li><strong>Live-Editing:</strong> Ermöglicht das temporäre Bearbeiten von HTML-Tags, Attributen und Texten direkt im Browser.</li>
<li><strong>CSS-Entwicklung:</strong> Stylesheets einsehen, Regeln an- und ausschalten oder neue CSS-Eigenschaften live testen.</li>
</ul>
<p><img src="../img/devtools-elements.jpg" alt="devtools-elements" /></p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-class="img-right" data-theme="thws-sts" lang="en-US" class="img-right" data-marpit-pagination="89" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--class:img-right;--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<h3 id="2-konsole-console">2. Konsole (Console)</h3>
<ul>
<li><strong>Fehlerprotokoll:</strong> Der zentrale Ort für Fehlermeldungen von JavaScript und Netzwerkproblemen (z. B. blockierte Ressourcen).</li>
<li><strong>Interaktivität:</strong> Erlaubt das Ausführen von JavaScript-Befehlen direkt im Kontext der geladenen Seite.</li>
<li><strong>Debugging:</strong> Ausgabe von Debug-Informationen mittels <code>console.log()</code>.</li>
</ul>
<p><img src="../img/devtools-console.jpg" alt="devtools-console" /></p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="90" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-class="img-right" data-theme="thws-sts" lang="en-US" class="img-right" data-marpit-pagination="90" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--class:img-right;--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<h3 id="3-netzwerk-network">3. Netzwerk (Network)</h3>
<ul>
<li><strong>Datenverkehr überwachen:</strong> Detaillierte Ansicht aller Ressourcen (HTML, CSS, JS, Bilder), die zwischen Browser und Server ausgetauscht werden.</li>
<li><strong>Metriken:</strong> Zeigt Ladezeiten, HTTP-Statuscodes, Dateigrößen und Antwort-Header an.</li>
<li><strong>Fehlersuche:</strong> Ideal zum Aufspüren von nicht gefundenen Dateien (404) oder langsamen Ladezeiten.</li>
</ul>
<p><img src="../img/devtools-network.jpg" alt="devtools-network" /></p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="91" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-class="img-right" data-theme="thws-sts" lang="en-US" class="img-right" data-marpit-pagination="91" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--class:img-right;--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<h3 id="4-quellen-sources">4. Quellen (Sources)</h3>
<ul>
<li><strong>Datei-Explorer:</strong> Zeigt alle geladenen Quelldateien der Website an.</li>
<li><strong>Code-Debugging:</strong> Ermöglicht das Setzen von <strong>Breakpoints</strong> in JavaScript.</li>
<li><strong>Schritt-für-Schritt-Ausführung:</strong> Der JS-Code kann an bestimmten Zeilen angehalten und Variablen-Werte live inspiziert werden.</li>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="formatierung-von-webseiten-mit-css-einf%C3%BChrung">Formatierung von Webseiten mit CSS: Einführung</h3>
<ul>
<li><strong>Früher: Vermischung von Inhalt und Design</strong>
<ul>
<li>Jedes HTML-Element erhielt direkte Formatierungsanweisungen (z. B. <code>&lt;font color=&quot;red&quot;&gt;</code> oder <code>&lt;b&gt;</code>).</li>
<li>Dies führte zu unlesbarem Code und enormem Pflegeaufwand bei großen Websites.</li>
</ul>
</li>
<li><strong>Heute: Separation of Concerns (Trennung der Zuständigkeiten)</strong>
<ul>
<li><strong>HTML</strong> beschreibt ausschließlich die <strong>Struktur &amp; Semantik</strong> (z. B. Überschriften, Absätze).</li>
<li><strong>CSS</strong> bestimmt das komplette <strong>visuelle Layout</strong> (Layout, Farben, Typografie).</li>
</ul>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="96" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="96" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Beispiel</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-comment">&lt;!-- index.html --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">link</span> <span class="hljs-attr">rel</span>=<span class="hljs-string">&quot;stylesheet&quot;</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;style.css&quot;</span>&gt;</span>

</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* style.css */</span>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Was ist CSS? (Cascading Style Sheets)</strong></p>
<ul>
<li><strong>Bedeutung:</strong> Übersetzt <em>Gestufte Gestaltungsbögen</em>. CSS ist ein lebendiger Standard (<em>Living Standard</em>), der vom W3C ständig weiterentwickelt wird.</li>
<li><strong>Die Kaskade (Cascading):</strong> Legt fest, welcher Style gewinnt, wenn sich Regeln widersprechen. Spezifischere Regeln überschreiben allgemeinere.</li>
<li><strong>Das Vererbungskursmodell:</strong> Übergeordnete Elemente vererben Styles an Kind-Elemente (z. B. eine im <code>&lt;body&gt;</code> definierte Schriftart gilt für alle Texte darin).</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="98" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="98" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Beispiel</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-tag">body</span> {
  <span class="hljs-attribute">font-family</span>: <span class="hljs-string">&#x27;Outfit&#x27;</span>, sans-serif;
  <span class="hljs-attribute">color</span>: <span class="hljs-number">#333333</span>; <span class="hljs-comment">/* Gilt für das gesamte Dokument */</span>
}

<span class="hljs-selector-tag">h1</span> {
  <span class="hljs-attribute">color</span>: <span class="hljs-number">#005564</span>; <span class="hljs-comment">/* Überschreibt die vererbte Farbe für h1-Elemente */</span>
}
</code></pre>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="99" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="99" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Selektoren &amp; Mediensteuerung</strong></p>
<ul>
<li><strong>Selektoren:</strong> Bestimmen präzise, welche HTML-Elemente formatiert werden.
<ul>
<li><strong>Elementname:</strong> <code>a { color: blue; }</code> (alle Hyperlinks)</li>
<li><strong>Klasse:</strong> <code>.highlight { background: yellow; }</code> (beliebige Elemente mit <code>class=&quot;highlight&quot;</code>)</li>
<li><strong>ID:</strong> <code>#main-header { font-size: 2em; }</code> (einzigartiges Element mit <code>id=&quot;main-header&quot;</code>)</li>
</ul>
</li>
<li><strong>Mediensteuerung (Media Queries):</strong> CSS ermöglicht unterschiedliche Formatierungen je nach Ausgabemedium (z. B. optimierte Druckansicht oder angepasstes Layout für Mobilgeräte).</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="100" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="100" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="103" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-class="img-right" data-theme="thws-sts" lang="en-US" class="img-right" data-marpit-pagination="103" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--class:img-right;--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<h3 id="notepad--html">Notepad &amp; html</h3>
<ul>
<li>Webseiten bestehen aus Text</li>
<li>WYSIWYG Editoren („What You See Is What You Get“) schreiben häufig „schlechten“ und unsauberen Code.</li>
<li>Daher &gt; Texteditor notepad++</li>
<li>notepad++ &quot;versteht&quot; html &amp; strukturiert Code mit Textauszeichnungen</li>
<li>Notepad++ &gt; neue leere Textdatei an.</li>
<li>Für korrekte Textauszeichnungen &gt; notepad++ auf html umstellen</li>
</ul>
<p><img src="../img/notepad-html.jpg" alt="alt text" /></p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="104" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-class="img-right" data-theme="thws-sts" lang="en-US" class="img-right" data-marpit-pagination="104" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--class:img-right;--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<p><strong>HTML-Syntax: Die Bausteine des Webs</strong></p>
<ul>
<li>Grundprinzip von HTML ist der sogenannte <strong>Tag</strong> (Markierung).</li>
<li>Fast jedes HTML-Dokument besteht aus einer Abfolge von Start-Tags, Inhalten und End-Tags, die das Gerüst der Seite bilden.</li>
</ul>
<p><img src="../img/syntax.jpg" alt="alt text" /></p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="105" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="105" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>1. Tags und ihre Funktion</strong><br />
Ein HTML-Tag besteht aus dem englischen Schlüsselwort in spitzen Klammern, z. B. <code>&lt;p&gt;</code> für einen Absatz oder <code>&lt;h1&gt;</code> für eine Hauptüberschrift. Fast alle Tags haben einen entsprechenden <strong>Schließenden Tag</strong>, der mit einem Schrägstrich (<code>/</code>) beginnt, z. B. <code>&lt;/p&gt;</code>. Der Inhalt, der formatiert werden soll, steht zwischen diesen beiden Tags.</p>
<p><strong>Beispiel für einen Absatz:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>Hier steht der Text, den der Browser als neuen Absatz darstellt.<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
</code></pre>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="106" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="106" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>2. Attribute: Zusätzliche Informationen</strong></p>
<ul>
<li>Tags können durch sogenannte <strong>Attribute</strong> ergänzt werden</li>
<li>Attribute stellen zusätzliche Informationen bereit</li>
<li>Attribute stehen immer im Start-Tag &amp; bestehen aus einem Attributnamen, einem Gleichheitszeichen und dem dazugehörigen Wert in Anführungszeichen.</li>
</ul>
<p><strong>Beispiel für ein Bild mit Attributen:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">img</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;foto.jpg&quot;</span> <span class="hljs-attr">alt</span>=<span class="hljs-string">&quot;Ein Foto von meiner Katze&quot;</span>&gt;</span>
</code></pre>
<p>In diesem Beispiel definieren das Attribut <code>src</code> (source) und <code>alt</code> (alternative Text) das Bild und dessen Beschriftung für Screenreader und wenn das Bild nicht geladen werden kann.</p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="107" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="107" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>3. Elemente &amp; leere Elemente</strong></p>
<ul>
<li>HTML-Elemente können Text oder andere Elemente enthalten.</li>
<li>z.B. Überschrift <code>&lt;h1&gt;</code>:  besteht aus einem Start-Tag <code>&lt;h1&gt;</code>, dem Inhalt <code>Meine Überschrift</code> und dem entsprechenden End-Tag <code>&lt;/h1&gt;</code>.</li>
<li>Es gibt auch sogenannte <strong>leere Elemente</strong> wie <code>&lt;img&gt;</code> oder <code>&lt;br&gt;</code></li>
<li>leere Elemente besitzen keinen Inhalt &amp; somit keinen End-Tag</li>
<li>Sie werden stattdessen oft mit einem abschließenden Schrägstrich (<code>&lt;br /&gt;</code>) geschrieben, um anzuzeigen, dass das Element abgeschlossen ist. (Guter Stil, aber nicht notwendig)</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="108" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="108" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Groß- und Kleinschreibung in HTML</strong></p>
<ul>
<li>Keine Case-Sensitivity: HTML-Element- und Attributnamen sind nicht fallsensitiv (Groß-/Kleinschreibung ist für den Browser egal, z. B. &lt;title&gt; vs. &lt;TITLE&gt;).</li>
<li>Übersichtlichkeit: Eine einheitliche Schreibweise verbessert die Lesbarkeit und Struktur des Codes.</li>
<li>Historischer Kontext (XHTML): Im älteren Standard XHTML war die Kleinschreibung zwingend vorgeschrieben.</li>
<li>Heutiger Standard: Die Kleinschreibung hat sich damals unter Entwicklern durchgesetzt und gilt auch heute noch als Best Practice („guter Stil“).</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="109" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-class="img-right" data-theme="thws-sts" lang="en-US" class="img-right" data-marpit-pagination="109" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--class:img-right;--theme:thws-sts;" data-marpit-pagination-total="175">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="110" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="110" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="ein-valides-html-dokument-die-bestandteile">Ein valides HTML-Dokument: Die Bestandteile</h3>
<ul>
<li><strong><code>&lt;!DOCTYPE html&gt;</code> (Dokumenttyp-Deklaration):</strong> Steht in der allerersten Zeile und teilt dem Browser mit, dass es sich um HTML5 handelt.</li>
<li><strong><code>&lt;html&gt;</code> (Wurzelelement):</strong> Umschließt das gesamte Dokument und definiert die Hauptsprache (z. B. <code>&lt;html lang=&quot;de&quot;&gt;</code>).</li>
<li><strong><code>&lt;head&gt;</code> (Kopfbereich):</strong> Umschließt unsichtbare Meta-Informationen (z. B. Zeichensatz <code>&lt;meta charset=&quot;utf-8&quot;&gt;</code>).</li>
<li><strong><code>&lt;title&gt;</code> (Seitentitel - PFLICHT!):</strong>
<ul>
<li>Ist im <code>&lt;head&gt;</code> platziert und für die Validität der Seite <strong>zwingend vorgeschrieben</strong> (Pflichtelement).</li>
<li>Definiert den Text, der im Browser-Tab und in Suchergebnissen (z. B. Google Search) erscheint.</li>
</ul>
</li>
<li><strong><code>&lt;body&gt;</code> (Inhaltsbereich):</strong> Umschließt alle sichtbaren Elemente einer Webseite (Texte, Bilder, Links, etc.).</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="111" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="111" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Minimales valides HTML5-Grundgerüst</strong><br />
Ein voll funktionsfähiges und standardkonformes HTML-Dokument sieht minimal so aus:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-meta">&lt;!DOCTYPE <span class="hljs-keyword">html</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">html</span> <span class="hljs-attr">lang</span>=<span class="hljs-string">&quot;de&quot;</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">head</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">meta</span> <span class="hljs-attr">charset</span>=<span class="hljs-string">&quot;utf-8&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">title</span>&gt;</span>Meine erste Webseite<span class="hljs-tag">&lt;/<span class="hljs-name">title</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">head</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">body</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>Hallo Welt!<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>Dies ist ein valides HTML5-Dokument.<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">html</span>&gt;</span>
</code></pre>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="112" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="112" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="code-einr%C3%BCckung-indentation">Code-Einrückung (Indentation)</h3>
<ul>
<li><strong>Für den Browser:</strong> Völlig egal. Browser ignorieren überflüssige Leerzeichen (Whitespaces) und Zeilenumbrüche im Quelltext.</li>
<li><strong>Für den Entwickler:</strong> Essentiell für die Lesbarkeit. Man erkennt auf den ersten Blick, welche Elemente ineinander verschachtelt sind und ob Tags korrekt geschlossen wurden.</li>
<li><strong>Die Grundregel:</strong> Jedes Kind-Element (untergeordnetes Element) wird um eine Stufe (meist 2 oder 4 Leerzeichen oder 1 Tabulator) weiter eingerückt als sein Eltern-Element.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">ul</span>&gt;</span> <span class="hljs-comment">&lt;!-- Übergeordnetes Eltern-Element --&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">li</span>&gt;</span>Erster Eintrag<span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span> <span class="hljs-comment">&lt;!-- Untergeordnete Kind-Elemente --&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">li</span>&gt;</span>Zweiter Eintrag<span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">ul</span>&gt;</span>
</code></pre>
<ul>
<li><strong>Tipp:</strong> In Notepad++ &gt; <code>Tab</code>-Taste zum Einrücken &gt; <code>Umschalt + Tab</code> zum „Ausrücken“</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="113" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="113" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Die 5 Elemente des HTML-Grundgerüsts</strong></p>
<ul>
<li><code>&lt;!DOCTYPE html&gt;</code></li>
<li><code>&lt;html&gt;</code></li>
<li><code>&lt;head&gt;</code></li>
<li><code>&lt;title&gt;</code></li>
<li><code>&lt;body&gt;</code></li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="114" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-class="img-right" data-theme="thws-sts" lang="en-US" class="img-right" data-marpit-pagination="114" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--class:img-right;--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<p><code>&lt;!DOCTYPE html&gt;</code></p>
<ul>
<li><strong>Dokumenttyp-Deklaration:</strong> in erster Zeile &amp; teilt Browser mit, dass es sich um HTML5 handelt.</li>
<li>früher Angabe der html-Version erforderlich (z.B. <code>&lt;!DOCTYPE html PUBLIC &quot;-//W3C//DTD XHTML 1.0 Strict//EN&quot; &quot;http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd&quot;&gt;</code>)</li>
<li>Seit HTML5  <code>&lt;!DOCTYPE html&gt;</code>.</li>
<li>rigorose Vereinfachung im Sinne von<br />
Less-is-more</li>
</ul>
<p><img src="../img/doctype.jpg" alt="alt text" /></p>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<p><code>&lt;head&gt;</code></p>
<ul>

<li>umschließt unsichtbare Meta-Informationen</li>
<li>Zeichensatz <code>&lt;meta charset=&quot;utf-8&quot;&gt;</code></li>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<p><strong>Zeichensatz-Deklaration im Head</strong></p>
<ul>
<li><code>&lt;meta charset=&quot;utf-8&quot;&gt;</code></li>
<li>Zeichenkodierung festlegen</li>
<li>für Suchmaschinen &amp; Screenreader wichtig</li>
<li>korrekte Darstellung von Sonderzeichen, Umlauten und Emojis über verschiedene Betriebssysteme &amp; Browser hinweg.</li>
<li>erstes Element im <code>&lt;head&gt;</code>, vor allen anderen Elementen im <code>&lt;head&gt;</code> (nicht zwingend, gilt aber als Best Practice).</li>
<li>muss innerhalb  erster 512 Bytes des Dokuments stehen</li>
</ul>
<p><img src="../img/utf8.jpg" alt="alt text" /></p>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="125" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="125" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><code>&lt;p&gt;</code> <strong>Absätze: Gliederung &amp; Syntax</strong></p>
<ul>
<li><strong>Funktion:</strong> Dienen der Strukturierung von Fließtext in logische Absätze (engl. <em>paragraph</em>).</li>
<li><strong>Syntax:</strong> <code>&lt;p&gt;</code> leitet einen Absatz ein, <code>&lt;/p&gt;</code> beendet ihn.</li>
<li><strong>Schließendes Tag optional?</strong>
<ul>
<li>In HTML5 ist das schließende <code>&lt;/p&gt;</code> technisch optional (der Browser schließt den Absatz bei bestimmten Folgeelementen implizit).</li>
<li>In XHTML ist es zwingend <strong>Pflicht</strong>.</li>
<li><strong>Guter Stil:</strong> Das schließende <code>&lt;/p&gt;</code> sollte immer angegeben werden. Es umschließt einen zusammenhängenden Textblock – es steht nicht für den Zwischenraum.</li>
</ul>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="126" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="126" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Verschachtelung &amp; Abstände bei Absätzen</strong></p>
<ul>
<li><strong>Keine Block-Elemente im Absatz:</strong> Ein <code>&lt;p&gt;</code>-Element darf keine anderen blockerzeugenden Elemente (z. B. Überschriften, Listen <code>&lt;ul&gt;</code>, Tabellen <code>&lt;table&gt;</code> oder andere Absätze) enthalten.</li>
<li><strong>Implizites Schließen:</strong> Erkennt der Browser ein unzulässiges Element innerhalb eines offenen <code>&lt;p&gt;</code>, schließt er den Absatz automatisch vorzeitig. Ein späteres schließendes <code>&lt;/p&gt;</code> ist dann ein verwaister Fehler.</li>
<li><strong>Abstände gestalten:</strong>
<ul>
<li><strong>Falsch:</strong> Leere Absätze (<code>&lt;p&gt;&amp;nbsp;&lt;/p&gt;</code>) oder mehrere <code>&lt;br&gt;</code>-Tags zur Abstandserzeugung missbrauchen.</li>
<li><strong>Richtig:</strong> Abstände sauber über die CSS-Eigenschaft <code>margin</code> definieren.</li>
</ul>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="127" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="127" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong><code>&lt;br&gt;</code> :Zeilenumbruch (Line Break)</strong></p>
<ul>
<li><strong>Bedeutung:</strong> Das <code>&lt;br&gt;</code>-Element (<em>break</em>) erzeugt einen logischen Zeilenumbruch innerhalb eines Textes.</li>
<li><strong>Best Practice:</strong> Nur nutzen, wenn der Umbruch <strong>Bestandteil des Inhalts</strong> ist. Fließtext sollte niemals manuell umgebrochen werden (das regelt der Viewport).</li>
<li><strong>Ausnahmen (sinnvoller Einsatz):</strong>
<ul>
<li>Postadressen (wichtig für die korrekte Gliederung der Anschrift).</li>
<li>Gedichte, Songtexte oder Liedzeilen.</li>
</ul>
</li>
<li><strong>Syntax:</strong> Es ist ein <em>leeres Element</em> ohne Inhalt (in HTML <code>&lt;br&gt;</code>, in XHTML <code>&lt;br /&gt;</code> geschrieben, kein End-Tag erforderlich).</li>
<li><strong>Quelle:</strong> <a href="https://wiki.selfhtml.org/wiki/HTML/Textauszeichnung/br">SelfHTML: br-Element</a></li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="128" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="128" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<h3 id="datei-speichern-wie-und-wohin">Datei speichern: WIE und WOHIN?</h3>
<ul>
<li><strong>Das Grundprinzip:</strong> Bevor Sie Ihre erste HTML-Seite speichern, ist das <strong>WIE</strong> und <strong>WOHIN</strong> in der Webentwicklung von besonderer Bedeutung.</li>
<li><strong>Schritt-für-Schritt-Anleitung für XAMPP:</strong>
<ol>
<li>Öffnen Sie das <strong>XAMPP Control Panel</strong> <code>1)</code> und starten Sie den <strong>Apache Webserver</strong> und <strong>MySQL</strong> <code>2)</code>.</li>
<li>Öffnen Sie mit <strong>Explorer</strong> <code>3)</code> das <strong>XAMPP Root-Verzeichnis</strong> <code>4)</code>.</li>
<li>In diesem liegt das <strong><code>htdocs</code>-Verzeichnis</strong> <code>4)</code> (dieses wird vom Apache Webserver gehostet).</li>
<li>Legen Sie darin ein <strong>beliebiges Unterverzeichnis</strong> an.</li>
<li><em>Empfehlung:</em> Zur Versionierung empfehlen sich weitere Unterverzeichnisse <code>5)</code>.</li>
<li>Nun können Sie im <strong>Notepad++</strong> das HTML-Grundgerüst als HTML-Datei speichern <code>6)</code>.</li>
</ol>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="129" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;../img/xampp-abspeichern.jpg&quot;);"><figcaption>full:bg</figcaption></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="129" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="129" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175" data-marpit-advanced-background="content">

</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="129" style="" data-marpit-pagination-total="175" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="130" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="130" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Die Alternative mit dem Mongoose Webserver</strong></p>
<ul>
<li>Projektordner anlegen.</li>
<li>HTML-Datei als index.html darin abspeichern.</li>
<li>mongoose.exe herunterladen und in denselben Projektordner kopieren.</li>
<li>Per Doppelklick ausführen.</li>
<li>Adresse <a href="http://localhost:8080">http://localhost:8080</a> im Webbrowser aufrufen.</li>
<li>Wichtiger Sicherheitshinweis zum Thema Mehrfachausführung/Port-Konflikt<br />
und Beenden über den Windows-Infobereich.</li>
</ul>
