<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Die Startseite (Einstiegsseite)</strong></p>
<ul>
<li><strong>Definition:</strong> Die Startseite bzw. Einstiegsseite ist dasjenige HTML-Dokument, das standardmäßig ausgeliefert wird, wenn ein Besucher Ihren Webauftritt ohne Angabe einer bestimmten Seite aufruft.</li>
<li><strong>Namensgebung:</strong>
<ul>
<li>Wie Sie die Startseite benennen müssen, sodass sie vom Webserver als solche erkannt wird, schreibt Ihr Webspace-Provider vor.</li>
<li>Meistens ist der Name <code>index.html</code>, <code>index.htm</code>, <code>default.html</code> oder <code>default.htm</code>.</li>
<li>Bei manchen Providern können Sie einen beliebigen Namen definieren.</li>
</ul>
</li>
<li><strong>Wichtigste Regel:</strong>
<ul>
<li>Die Startseite Ihrer Webseite heißt <strong>IMMER <code>index.html</code></strong>!</li>
<li>Beim Aufruf der Domain sucht der Webserver immer nach einer Datei mit diesem Namen, um sie anzuzeigen.</li>
</ul>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Think Semantik</strong></p>
<ul>
<li>Semantik ist die Lehre von der Bedeutung<br />
von Zeichen und sprachlichen Ausdrücken.</li>
<li>Im Zusammenhang mit HTML bezieht sich<br />
Semantik auf die Bedeutung von HTML-Tags.</li>
<li>HTML-Tags werden verwendet, um die Struktur<br />
und den Inhalt einer Webseite zu beschreiben.</li>
<li>Semantik ist wichtig, da sie es Suchmaschinen<br />
ermöglicht, den Inhalt einer Webseite zu<br />
verstehen und zu indexieren.</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="140" style="" data-marpit-pagination-total="175" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="141" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-class="structural" data-theme="thws-sts" lang="en-US" class="structural" data-marpit-pagination="141" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--class:structural;--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>

<h3 id="tags-zur-strukturierung-von-text">Tags zur Strukturierung von Text</h3>
<p><strong>HTML-Elemente für Semantik und Lesbarkeit</strong></p>
<ul>
<li>Übersicht der wichtigsten Text-Tags</li>
<li>Eigenschaften von Block- und Inline-Elementen</li>
<li>Code-Beispiele für die Praxis</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="142" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="142" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Überschriften (h1 - h6)</strong></p>
<p>Dienen der Strukturierung und Gewichtung:</p>
<ul>
<li><strong><code>&lt;h1&gt;</code> bis <code>&lt;h6&gt;</code></strong>: Abstufung der Wichtigkeit</li>
<li><strong>Eigenschaften</strong>:
<ul>
<li>Block-Elemente (erzeugen eine neue Zeile)</li>
<li>Suchmaschinen (SEO) nutzen sie zur Gewichtung</li>
<li>Pro Seite sollte es nur genau eine <code>&lt;h1&gt;</code> geben</li>
</ul>
</li>
<li><strong>Code-Beispiel</strong>:<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>Hauptüberschrift<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">h2</span>&gt;</span>Unterüberschrift<span class="hljs-tag">&lt;/<span class="hljs-name">h2</span>&gt;</span>
</code></pre>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="143" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="143" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Textabsätze (p)</strong></p>
<p>Der Standard für Fließtext:</p>
<ul>
<li><strong><code>&lt;p&gt;</code> (Paragraph)</strong>: Umschließt Textabschnitte</li>
<li><strong>Eigenschaften</strong>:
<ul>
<li>Block-Element mit automatischen Abständen</li>
<li>Verbessert den Lesefluss durch visuelle Pausen</li>
<li>Ignoriert aufeinanderfolgende Leerzeichen im Quelltext</li>
</ul>
</li>
<li><strong>Code-Beispiel</strong>:<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>Dies ist ein Absatz.<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>Dies ist der nächste Absatz.<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
</code></pre>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="144" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="144" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Ungeordnete Listen (ul)</strong></p>
<p>Für Sammlungen ohne feste Reihenfolge:</p>
<ul>
<li><strong><code>&lt;ul&gt;</code> (Unordered List)</strong>: Umschließt Listenelemente</li>
<li><strong><code>&lt;li&gt;</code> (List Item)</strong>: Einzelne Listenpunkte</li>
<li><strong>Eigenschaften</strong>:
<ul>
<li>Block-Elemente</li>
<li>Standardmäßig mit Aufzählungspunkten (Bullets)</li>
</ul>
</li>
<li><strong>Code-Beispiel</strong>:<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">ul</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">li</span>&gt;</span>HTML5 Semantik<span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">li</span>&gt;</span>CSS Styling<span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">ul</span>&gt;</span>
</code></pre>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="145" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="145" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Geordnete Listen (ol)</strong></p>
<p>Für Abläufe, Rezepte und Anleitungen:</p>
<ul>
<li><strong><code>&lt;ol&gt;</code> (Ordered List)</strong>: Umschließt Listenelemente</li>
<li><strong><code>&lt;li&gt;</code> (List Item)</strong>: Einzelne Listenpunkte</li>
<li><strong>Eigenschaften</strong>:
<ul>
<li>Block-Elemente</li>
<li>Werden automatisch nummeriert (1., 2., 3...)</li>
<li>Attribute wie <code>start</code> oder <code>type</code> möglich</li>
</ul>
</li>
<li><strong>Code-Beispiel</strong>:<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html">   <span class="hljs-tag">&lt;<span class="hljs-name">ol</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">li</span>&gt;</span>HTML-Datei anlegen<span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Zeilenumbruch (br) &amp; Trenner (hr)</strong></p>
<p>Für feine Text- und Layoutsteuerung:</p>
<ul>
<li><strong><code>&lt;br&gt;</code> (Line Break)</strong>: Erzwingt einen Zeilenumbruch</li>
<li><strong><code>&lt;hr&gt;</code> (Horizontal Rule)</strong>: Thematischer Bruch</li>
<li><strong>Eigenschaften</strong>:
<ul>
<li><strong>Leere Elemente</strong> (haben keinen schließenden Tag!)</li>
<li><code>&lt;br&gt;</code> wirkt auf Inline-Ebene (bricht nur Text um)</li>
<li><code>&lt;hr&gt;</code> wirkt auf Block-Ebene (erzeugt eine Linie)</li>
</ul>
</li>
<li><strong>Code-Beispiel</strong>:<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html">   Erste Zeile<span class="hljs-tag">&lt;<span class="hljs-name">br</span>&gt;</span>Zweite Zeile
<span class="hljs-tag">&lt;<span class="hljs-name">hr</span>&gt;</span>
Anderes Thema...
</code></pre>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="147" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="147" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Vorformatierter Text (pre &amp; code)</strong></p>
<p>Für Quellcode und exakte Abstände:</p>
<ul>
<li><strong><code>&lt;pre&gt;</code> (Preformatted)</strong>: Behält alle Leerzeichen und Zeilenumbrüche exakt bei</li>
<li><strong><code>&lt;code&gt;</code></strong>: Kennzeichnet Text als Programmcode</li>
<li><strong>Kombination</strong>: <code>&lt;pre&gt;&lt;code&gt;...&lt;/code&gt;&lt;/pre&gt;</code></li>
<li><strong>Code-Beispiel</strong>:<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html">   <span class="hljs-tag">&lt;<span class="hljs-name">pre</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">code</span>&gt;</span>
  function init() {
  console.log(&quot;Start&quot;);
}
<span class="hljs-tag">&lt;/<span class="hljs-name">code</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">pre</span>&gt;</span>

</code></pre>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Starke Betonung (strong)</strong></p>
<p>Für besonders wichtige Inhalte:</p>
<ul>
<li><strong><code>&lt;strong&gt;</code> (Strong Importance)</strong>: Kennzeichnet Text von großer Bedeutung</li>
<li><strong>Eigenschaften</strong>:
<ul>
<li>Inline-Element (fließt im Text mit)</li>
<li>Drückt Wichtigkeit, Dringlichkeit oder Ernsthaftigkeit aus</li>
<li>Browser stellen den Text standardmäßig <strong>fett</strong> dar</li>
<li>Wichtig für Screenreader (akustische Hervorhebung)</li>
<li><em>Hinweis</em>: Nutze <code>&lt;strong&gt;</code> für Semantik, nicht das rein dekorative <code>&lt;b&gt;</code></li>
</ul>
</li>
<li><strong>Code-Beispiel</strong>:<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html">   Achtung: Die Steckdose steht <span class="hljs-tag">&lt;<span class="hljs-name">strong</span>&gt;</span>unter Strom<span class="hljs-tag">&lt;/<span class="hljs-name">strong</span>&gt;</span>!
</code></pre>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="149" data-paginate="true" data-header="**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170" data-footer="[zurück zur Übersicht](../index.html)" data-theme="thws-sts" lang="en-US" data-marpit-pagination="149" style="--paginate:true;--header:**Webprogrammierung** &lt;br&gt; THWS Modul-Nr: 6322170;--footer:[zurück zur Übersicht](../index.html);--theme:thws-sts;" data-marpit-pagination-total="175">
<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Hervorhebung (em)</strong></p>
<p>Für sprachliche Betonung:</p>
<ul>
<li><strong><code>&lt;em&gt;</code> (Emphasis)</strong>: Hebt Wörter oder Phrasen im Satz hervor</li>
<li><strong>Eigenschaften</strong>:
<ul>
<li>Inline-Element (fließt im Text mit)</li>
<li>Ändert je nach betontem Wort die Aussage des Satzes</li>
<li>Browser stellen den Text standardmäßig <em>kursiv</em> dar</li>
<li>Wird von Screenreadern akustisch betont (Intonation)</li>
<li><em>Hinweis</em>: Nutze <code>&lt;em&gt;</code> für Semantik, nicht das rein dekorative <code>&lt;i&gt;</code></li>
</ul>
</li>
<li><strong>Code-Beispiel</strong>:<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html">   Das müssen Sie <span class="hljs-tag">&lt;<span class="hljs-name">em</span>&gt;</span>heute<span class="hljs-tag">&lt;/<span class="hljs-name">em</span>&gt;</span> noch erledigen!
</code></pre>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Live Server &amp; Auto-Verwaltung</strong></p>
<p>Die wichtigsten Erweiterungen für Einsteiger:</p>
<ul>
<li><strong>Live Server (Extension)</strong>:
<ul>
<li>Startet mit einem Klick lokalen Webserver.</li>
<li>Aktualisiert den Browser automatisch<br />
beim Speichern (Live Reload).</li>
</ul>
</li>
<li><strong>Auto Rename Tag</strong>:
<ul>
<li>Ändert das schließende Tag automatisch,<br />
wenn das öffnende Tag geändert wird.</li>
</ul>
</li>
<li><strong>Prettier (Code Formatter)</strong>:
<ul>
<li>Formatiert den Code beim Speichern<br />
automatisch nach festen Regeln.</li>
</ul>
</li>
</ul>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>CSS-Grundprinzip &amp; Syntax</strong></p>
<p>Cascading Style Sheets<br />
(Mehrstufige Formatvorlagen):</p>
<ul>
<li><strong>Zweck</strong>: Bestimmt das Design, Layout<br />
und die Darstellung von HTML-Elementen.</li>
<li><strong>Grundregel</strong>: Selektor wählt das Element,<br />
Deklarationen definieren das Design.</li>
<li><strong>Aufbau einer Deklaration</strong>:
<ul>
<li><strong>Eigenschaft (Property)</strong>: Was soll<br />
geändert werden (z. B. <code>color</code>)?</li>
<li><strong>Wert (Value)</strong>: Wie soll es<br />
aussehen (z. B. <code>blue</code>)?</li>
</ul>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Die drei Wege der CSS-Einbindung</strong></p>
<p>Wie kommt das CSS-Design in den HTML-Code?</p>
<ul>
<li><strong>1. Inline-Styles</strong>:
<ul>
<li>Direkt im HTML-Tag mit<br />
dem <code>style</code>-Attribut.</li>
</ul>
</li>
<li><strong>2. Interne Stylesheets</strong>:
<ul>
<li>Im <code>&lt;head&gt;</code>-Bereich in einem <code>&lt;style&gt;</code>-Tag.</li>
</ul>
</li>
<li><strong>3. Externe Stylesheets (Best Practice)</strong>:
<ul>
<li>In einer eigenen <code>.css</code>-Datei<br />
(z. B. <code>style.css</code>).</li>
<li>Verknüpfung im <code>&lt;head&gt;</code> über<br />
ein <code>&lt;link&gt;</code>-Tag.</li>
</ul>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Code-Beispiele der CSS-Einbindung</strong></p>
<ul>
<li><strong>Inline-Style (Direkt am Element)</strong>:<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">style</span>=<span class="hljs-string">&quot;color: orange; font-size: 20px;&quot;</span>&gt;</span>Maiks Service<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>

</li>
<li><strong>Internes Stylesheet (Im HTML-Kopf)</strong>:<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">style</span>&gt;</span><span class="language-css">

</span><span class="hljs-tag">&lt;/<span class="hljs-name">style</span>&gt;</span>
</code></pre>
</li>
<li><strong>Externes Stylesheet (Saubere Trennung)</strong>:<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-comment">&lt;!-- Im HTML-Kopf verlinkt: --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">link</span> <span class="hljs-attr">rel</span>=<span class="hljs-string">&quot;stylesheet&quot;</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;css/style.css&quot;</span>&gt;</span>

</ul>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Das Kaskaden-Prinzip (Cascading)</strong></p>
<p>Welche CSS-Regel gewinnt, wenn es Konflikte gibt?</p>
<ul>
<li><strong>1. Die Reihenfolge</strong>:
<ul>
<li>Später definierte CSS-Regeln überschreiben frühere Regeln.</li>
</ul>
</li>
<li><strong>2. Die Spezifität (Gewichtung)</strong>:
<ul>
<li>Spezifischere Selektoren überschreiben allgemeinere.</li>
<li><em>Reihenfolge</em>: Inline-Style <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.09ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="1.312ex" role="img" focusable="false" viewBox="0 -540 778 580"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="3E" d="M84 520Q84 528 88 533T96 539L99 540Q106 540 253 471T544 334L687 265Q694 260 694 250T687 235Q685 233 395 96L107 -40H101Q83 -38 83 -20Q83 -19 83 -17Q82 -10 98 -1Q117 9 248 71Q326 108 378 132L626 250L378 368Q90 504 86 509Q84 513 84 520Z"></path></g></g></g></svg></mjx-container> ID-Selektor <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.09ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="1.312ex" role="img" focusable="false" viewBox="0 -540 778 580"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="3E" d="M84 520Q84 528 88 533T96 539L99 540Q106 540 253 471T544 334L687 265Q694 260 694 250T687 235Q685 233 395 96L107 -40H101Q83 -38 83 -20Q83 -19 83 -17Q82 -10 98 -1Q117 9 248 71Q326 108 378 132L626 250L378 368Q90 504 86 509Q84 513 84 520Z"></path></g></g></g></svg></mjx-container> Klasse <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.09ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="1.312ex" role="img" focusable="false" viewBox="0 -540 778 580"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="3E" d="M84 520Q84 528 88 533T96 539L99 540Q106 540 253 471T544 334L687 265Q694 260 694 250T687 235Q685 233 395 96L107 -40H101Q83 -38 83 -20Q83 -19 83 -17Q82 -10 98 -1Q117 9 248 71Q326 108 378 132L626 250L378 368Q90 504 86 509Q84 513 84 520Z"></path></g></g></g></svg></mjx-container> Element-Tag.</li>
</ul>
</li>
<li><strong>3. Die Vererbung (Inheritance)</strong>:

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Vererbung in CSS (Inheritance)</strong></p>
<ul>
<li><strong>Grundprinzip</strong>: CSS-Regeln für ein Element gelten für alle Instanzen dieses Elements auf der Webseite (z. B. Schriftart für alle <code>&lt;p&gt;</code>-Elemente).</li>
<li><strong>Definition</strong>: Vererbung ist die Übertragung von Eigenschaften von übergeordneten (Eltern-) Elementen auf untergeordnete (Kinder-) Elemente.</li>
<li><strong>Vorteil</strong>: Vermeidung redundanter CSS-Regeln – Layouts können effizient an zentraler Stelle gepflegt werden.</li>
<li><strong>Vererbte vs. nicht-vererbte Eigenschaften</strong>:
<ul>
<li><em>Vererbt</em>: Text- und Schrifteigenschaften (z. B. <code>font-family</code>, <code>color</code>, <code>line-height</code>).</li>
<li><em>Nicht vererbt</em>: Layout- und Box-Eigenschaften (z. B. <code>margin</code>, <code>padding</code>, <code>border</code>, <code>background-color</code>).</li>
</ul>
</li>
</ul>
<footer><a href="../index.html">zurück zur Übersicht</a></footer>
</section>

<header><strong>Webprogrammierung</strong> <br /> THWS Modul-Nr: 6322170</header>
<p><strong>Praxisbeispiele zur Vererbung</strong></p>
<ul>
<li><strong>Zentrale Standardschriftart</strong>:
<ul>
<li>Wird die Schriftart Arial für das <code>&lt;body&gt;</code>-Element festgelegt, gilt sie für alle untergeordneten Elemente.</li>
<li>Da alle sichtbaren Elemente vom <code>&lt;body&gt;</code> abstammen, fungiert dies als globale Standardschriftart der Seite.</li>
</ul>
</li>
<li><strong>Das img-Element &amp; Alternativtext</strong>:
<ul>
<li>Ein Bild (<code>&lt;img&gt;</code>) selbst ändert sein Aussehen nicht durch Schriftarten.</li>
<li>Falls das Bild jedoch nicht geladen werden kann, wird der Alternativ-Text (<code>alt=&quot;...&quot;</code>) angezeigt.</li>
<li>Da das <code>&lt;img&gt;</code> dem <code>&lt;p&gt;</code>-Element untergeordnet ist, erbt dieser Text automatisch dieselbe Schriftart wie der restliche Absatz.</li>
</ul>
</li>
</ul>
